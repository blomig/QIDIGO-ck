<script type="application/json" id="ckdata">{"version": "qidigo-ck tour 1", "date": "2026-11-03", "c0": "Duel classé 1 contre 1 pour iPhone (portrait), freemium sans pub, sur les 81 croisements d'une grille de traits 9×9 : chaque joueur a X pions ; à chaque tour, les deux joueurs donnent un ordre résolu en même temps — poser un pion, ou déplacer un pion par un trajet dessiné ; un trajet coupé par un ordre adverse annule les deux déplacements ; les pions peuvent être capturés et retournent alors dans la réserve de leur propriétaire ; on gagne du terrain, et la partie finit après un nombre de tours ou au-delà d'un seuil de possession (forme ouverte) ; simple, rapide, profond.", "c0eval": {"forces": ["Le chapeau est court et tient en une phrase : bon signe pour « simple » (K16, K74).", "La coupure qui annule les deux ordres est l'idée originale : on n'a trouvé aucun jeu où un trajet dessiné et coupé annule les deux camps (K144, K152, K156 : collisions sur un point seulement).", "Le retour en réserve (K105) évite l'effet « boule de neige » de l'attrition et rejoint les règles Ing (K121)."], "faiblesses": ["Trois trous structurants : ce qu'est « posséder », ce qu'est « couper », comment on capture. Le chapeau ne décrit pas encore un jeu jouable.", "Simultané + annulation mutuelle : risque de blocage (le meneur annule tout) et d'amas d'annulations (K161).", "Matériel qui ne diminue jamais : la fin doit venir des tours ou du seuil (K160).", "9×9 en portrait : 43,7 pt par croisement, sous les 44 pt (K158) ; dessiner un trajet au doigt sera serré."], "verdict": "C0 recevable comme chapeau (il garde ouvertes les inconnues du BRIEF), mais pas encore partitionné en règles : il faut trancher les branches C1–C4 avant toute maquette papier."}, "themes": {"L": "Goûts et décisions de Lomig", "S": "Simultanéité et ordres (Diplomacy)", "G": "Go", "Q": "Qix et clones", "T": "Tracés, territoire et capture", "V": "Déjà-vu (jeux proches)", "C": "Classement", "I": "iPhone et interface", "M": "Marché et monétisation", "B": "Bonnes pratiques de design", "P": "Prototype et technique", "D": "Déductions (K→K)"}, "status": {"sure": "sûre", "creuser": "à creuser", "evoquee": "évoquée"}, "values": {"s": "simple", "r": "rapide", "p": "profond"}, "K": [{"id": "K1", "slug": "freemium", "theme": "L", "status": "sure", "title": "Freemium, zéro pub", "text": "Le jeu est freemium (gratuit puis achats intégrés) et n'a aucune publicité ; c'est non négociable. Vaut tel quel pour QIDIGO.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K2 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K2", "slug": "competition", "theme": "L", "status": "sure", "title": "Compétition et profondeur stratégique", "text": "Lomig aime la compétition et la profondeur stratégique (échecs, Hearthstone) plus que la vitesse des réflexes. La « collection » du JdS tenait aux cartes : elle ne se transpose pas d'office à QIDIGO (pas de cartes).", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K3 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K3", "slug": "recolter", "theme": "L", "status": "sure", "title": "Récolter = gagner (pas de récolte passive)", "text": "Pas de récolte passive (ouvrir le jeu pour ramasser) : tout ce que le joueur reçoit doit venir d'une victoire. Vaut tel quel pour QIDIGO.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K4 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K4", "slug": "echecslents", "theme": "L", "status": "sure", "title": "Échecs lents quotidiens", "text": "Lomig joue aux échecs tous les jours, en partie lente (un coup tous les 3 jours). Il connaît et aime la réflexion au long cours.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K6 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K5", "slug": "blomix", "theme": "L", "status": "sure", "title": "Savoir-faire puzzle : BLOMIX", "text": "Lomig a publié BLOMIX, un jeu de puzzle. Compétence de lisibilité et de « petit plateau » utile pour une grille 9×9.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K8 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K6", "slug": "blomixpas", "theme": "L", "status": "sure", "title": "BLOMIX ne sert pas de socle", "text": "Réponse de Lomig à Q4 (JdS) : BLOMIX n'est pas une base de code ou de jeu à reprendre. On garde le savoir-faire, pas le jeu.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q4"], "origin": "reprise JdS K413 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K7", "slug": "adressedecision", "theme": "L", "status": "sure", "title": "Adresse de décision, pas geste pur", "text": "Lomig ne veut pas d'adresse pure (réflexe, précision du doigt) ; il veut une montée en compétence par la décision. Pour QIDIGO : tracer un trajet doit être un geste trivial, la difficulté est dans le choix du trajet.", "sources": ["Lomig, réponses aux questions Q1–Q3, 25/10/2026"], "origin": "reprise JdS K12 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K8", "slug": "courtprofond", "theme": "L", "status": "sure", "title": "Court + profond", "text": "Piste de départ du JdS : parties courtes ET profondeur stratégique (l'« adresse » est devenue adresse de décision, K7). C'est exactement le « simple, rapide, profond » du pitch QIDIGO.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K9 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K9", "slug": "dureefixe", "theme": "L", "status": "sure", "title": "Parties à durée fixe et courte", "text": "Lomig veut des parties à durée définie et plutôt courte, comme Clash Royale ; les parties longues et variables de Hearthstone sont pour lui un défaut.", "sources": ["Lomig, commentaires dans ck.html, 25/10/2026"], "origin": "reprise JdS K249 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K10", "slug": "vraiaffrontement", "theme": "L", "status": "sure", "title": "Un vrai affrontement, pas « chacun de son côté »", "text": "Lomig refuse le PvP où chacun joue sur son plateau (Rush Royale) : il veut un vrai match où les coups de l'un gênent l'autre. Dans QIDIGO, la coupure de trajet est ce point de contact.", "sources": ["Lomig, commentaires dans ck.html, 25/10/2026"], "origin": "reprise JdS K250 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K11", "slug": "pourcentcarte", "theme": "L", "status": "sure", "title": "Gagner en occupant plus de x % de la carte", "text": "Idée de Lomig (25/10/2026) : le but est d'occuper plus de x % de la carte. Principe transposable tel quel au terrain de la grille 9×9 (la mécanique de « combattants » du JdS ne l'est pas).", "sources": ["Lomig, 25/10/2026, idée originale"], "origin": "reprise JdS K265 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K12", "slug": "plusdeterrain", "theme": "L", "status": "sure", "title": "Plus de terrain au gong, nul possible, pas de base", "text": "Lomig aime qu'à la fin du temps de jeu, celui qui a le plus de terrain gagne, que le nul soit possible, et qu'il n'y ait pas de base de départ ; les nouveaux déploiements ne se font que depuis le terrain possédé. Transposable : « où peut-on poser un pion ? » (C9).", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K319 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K13", "slug": "simultane", "theme": "L", "status": "sure", "title": "Tours simultanés en temps limité, puis exécution", "text": "Réponse de Lomig à Q23 (JdS) : les deux joueurs jouent leur tour en même temps, puis on exécute, avec un temps limité (modèle Diplomacy / Hearthstone). Le pitch QIDIGO le reprend (ordres puis résolution).", "sources": ["Lomig, réponses en chat, 27/10/2026 (tour 14)"], "origin": "reprise JdS K337 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K14", "slug": "phases", "theme": "L", "status": "creuser", "title": "Deux phases par tour : ordres, puis exécution", "text": "Lomig (tour 13 du JdS) : chaque tour comporte une phase d'ordres, en même temps pour les deux joueurs, puis une phase d'exécution. Le « mana » du JdS ne se transpose pas.", "sources": ["piste : Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K310 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K15", "slug": "sansstress", "theme": "L", "status": "sure", "title": "Jouer son tour sans stress, en parties courtes", "text": "Lomig aimait jouer son tour sans stress dans Hearthstone, veut des parties pas trop longues, mais sans le stress « arcade » de Clash Royale. Tension directe avec un chrono serré.", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K312 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K16", "slug": "purete", "theme": "L", "status": "sure", "title": "Pureté des échecs : peu de règles, des fonctions claires", "text": "Lomig voulait des règles les plus simples possibles, pour une pureté et une élégance comme aux échecs. Transposé à QIDIGO (sans cartes) : chaque règle ajoutée doit gagner sa place ; viser une règle tenant sur une carte.", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K316 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K17", "slug": "dureefixedepart", "theme": "L", "status": "sure", "title": "Durée de partie fixe au départ ; la cadence se testera", "text": "Réponse de Lomig à Q24 (JdS) : rester sur un temps fixe au début, et voir en testant s'il faut des parties plus rapides ou plus longues.", "sources": ["Lomig, réponses en chat, 27/10/2026 (tour 14)"], "origin": "reprise JdS K338 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K18", "slug": "cadencechoisie", "theme": "L", "status": "creuser", "title": "Cadence choisie par les joueurs, comme aux échecs", "text": "Piste de Lomig (JdS) : laisser les joueurs choisir la cadence, comme aux échecs, au lieu de l'imposer. Reportée par K17 (cadence fixe d'abord).", "sources": ["piste : Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K317 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K19", "slug": "poseouordre", "theme": "L", "status": "sure", "title": "À chaque tour : poser du neuf et/ou ordonner ce qui est posé", "text": "Réponse de Lomig à Q26 (JdS) : chaque tour, on peut poser du nouveau et/ou donner des ordres à ce qui est déjà déployé. Le pitch QIDIGO resserre en « OU » : une pose OU un déplacement par tour.", "sources": ["Lomig, réponses en chat, 27/10/2026 (tour 14)"], "origin": "reprise JdS K340 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K20", "slug": "prototyper", "theme": "L", "status": "sure", "title": "Un jeu, ce sont des règles et des paramètres : prototyper", "text": "Lomig : il faudra prototyper pour tester les choix dans un formalisme basique. Pour QIDIGO : la plupart des C de ce tour sont des paramètres à tester (nombre de pions, longueur de trajet, seuil).", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K311 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K21", "slug": "bmsansp2w", "theme": "M", "status": "sure", "title": "Modèle économique sans pay-to-win", "text": "Réponse de Lomig à Q5 (JdS) : un modèle proche de Hearthstone et Clash, sans pay-to-win. Le détail (cartes à débloquer) ne se transpose pas : QIDIGO n'a pas de cartes ; il faudra trouver ce qui se vend (cosmétique, accès, saisons) sans toucher à l'équité.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q5"], "origin": "reprise JdS K414 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K22", "slug": "payeraccelere", "theme": "M", "status": "sure", "title": "Payer accélère sans rendre le sommet inatteignable", "text": "Réponse de Lomig à Q36 (JdS) : ceux qui paient accélèrent leur progression, mais le sommet reste accessible sans payer. Dans un jeu sans contenu à débloquer comme QIDIGO, « accélérer » n'a pas encore d'objet : question ouverte.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q36"], "origin": "reprise JdS K432 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K23", "slug": "tuto", "theme": "L", "status": "sure", "title": "Un tutoriel, puis une ou deux parties contre le jeu", "text": "Réponse de Lomig à Q22 (JdS) : un tutoriel, puis une ou deux parties contre le jeu en mode débutant, avant d'accéder au classé.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q22"], "origin": "reprise JdS K422 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K24", "slug": "tutopassable", "theme": "L", "status": "sure", "title": "Tutoriel passable, parties contre l'IA obligatoires", "text": "Réponse de Lomig à Q43 (JdS) : le tutoriel peut être passé, mais les parties contre l'IA restent obligatoires.", "sources": ["Lomig, 28/10/2026, chat CDP (texte complet dans reponses-Q38-Q45-chat.md), Q43"], "origin": "reprise JdS K457 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K25", "slug": "animations", "theme": "L", "status": "sure", "title": "Pendant l'exécution, on regarde ; animations intenses et rapides", "text": "Réponse de Lomig à Q27 (JdS) : pendant l'exécution, on regarde, et les animations doivent être intenses et rapides. Pour QIDIGO : voir les deux trajets se dérouler et se couper est le moment fort du tour.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q27"], "origin": "reprise JdS K423 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K26", "slug": "duelsclasses", "theme": "C", "status": "sure", "title": "Seulement des duels classés", "text": "Réponse de Lomig à Q33 (JdS) : seulement des duels classés. QIDIGO est donc un 1 contre 1 classé.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q33"], "origin": "reprise JdS K429 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K27", "slug": "elo", "theme": "C", "status": "sure", "title": "Décision : un classement de type Elo", "text": "Lomig a décidé d'un classement de type Elo pour apparier les joueurs et afficher leur niveau. Vaut pour QIDIGO.", "sources": ["Lomig, message du 25/10/2026"], "origin": "reprise JdS K228 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K28", "slug": "recompensevictoire", "theme": "L", "status": "sure", "title": "Chaque victoire classée donne une récompense", "text": "Réponse de Lomig à Q59 (JdS) : chaque victoire classée donne une récompense. Cohérent avec K3 (récolter = gagner).", "sources": ["Lomig, 29/10/2026, chat CDP (texte complet dans reponses-Q59-Q64-chat.md), Q59"], "origin": "reprise JdS K495 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K29", "slug": "testflight", "theme": "P", "status": "sure", "title": "Test par une build TestFlight de base", "text": "Réponse de Lomig à Q35 (JdS) : le test se fera par une build TestFlight de base, avec des bêta-testeurs.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q35"], "origin": "reprise JdS K431 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K30", "slug": "v0sansserveur", "theme": "P", "status": "sure", "title": "D'abord une v0 sans serveur (passe-le-téléphone + IA simple)", "text": "Réponse de Lomig à Q45 (JdS) : d'abord une v0 sans serveur (passe-le-téléphone et IA simple) dans TestFlight, puis le duel en ligne. Vaut pour un prototype local de QIDIGO.", "sources": ["Lomig, 28/10/2026, chat CDP (texte complet dans reponses-Q38-Q45-chat.md), Q45"], "origin": "reprise JdS K459 (CK/base-K.md du JdS, § G -chat.md), Q66"], "origin": "reprise JdS K530 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K39", "slug": "iap", "theme": "M", "status": "sure", "title": "IAP jeux mobiles ≈ 82 Md$, stagnation", "text": "Sensor Tower : revenus IAP des jeux mobiles 2025 ≈ 82 Md$ (+1,3 %), puis −2 % au S1 2026 ; le marché passe du volume à la valeur à vie.", "sources": ["https://sensortower.com/blog/state-of-gaming-2026", "https://sensortower.com/blog/h1-2026-digital-gaming-market-index"], "origin": "reprise JdS K50 (CK/base-K.md du JdS, § Marché)"}, {"id": "K40", "slug": "appstore", "theme": "M", "status": "sure", "title": "App Store > Google Play en revenus", "text": "Sensor Tower : l'App Store génère ≈ 75 % de revenus IAP de plus que Google Play avec 4 fois moins de téléchargements. Conforte le choix iPhone d'abord.", "sources": ["https://sensortower.com/blog/state-of-gaming-2026"], "origin": "reprise JdS K51 (CK/base-K.md du JdS, § Marché)"}, {"id": "K41", "slug": "strategie4x", "theme": "M", "status": "sure", "title": "La stratégie croît, surtout par les 4X", "text": "La stratégie était le seul genre en hausse de téléchargements dans toutes les grandes régions en 2025, tirée par les 4X ; au T2 2026, les anciens 4X reculent.", "sources": ["https://sensortower.com/blog/state-of-gaming-2026", "https://naavik.co/f2p-mobile/h1-2026-4x-strategys-ua-reckoning/"], "origin": "reprise JdS K52 (CK/base-K.md du JdS, § Marché)"}, {"id": "K42", "slug": "ccgdeclin", "theme": "M", "status": "sure", "title": "CCG digitaux en déclin", "text": "Marvel Snap : 99 M$ (2023) → 26 M$ (2025) ; Legends of Runeterra : développement PvP arrêté en 2024. Abandonner les cartes n'éloigne pas de marchés en croissance.", "sources": ["https://www.blog.udonis.co/statistics/marvel-snap", "https://playruneterra.com/en-sg/news/game-updates/legends-of-runeterra-2024-state-of-the-game-faq"], "origin": "reprise JdS K55 (CK/base-K.md du JdS, § Marché)"}, {"id": "K43", "slug": "chesscom", "theme": "M", "status": "sure anked-is-dead-and-ranked-is-back/"], "origin": "reprise JdS K238 (CK/base-K.md du JdS, § Technique & plateforme)"}, {"id": "K56", "slug": "coldstart", "theme": "C", "status": "sure", "title": "Démarrage à froid du classement", "text": "Un nouveau joueur n'a pas de niveau connu ; Glicko-2 démarre avec une forte incertitude pour accélérer les premiers ajustements.", "sources": ["https://lichess.org/faq", "https://handbook.fide.com/chapter/B022024", "https://www.microsoft.com/en-us/research/project/trueskill-ranking-system/"], "origin": "reprise JdS K240 (CK/base-K.md du JdS, § Technique & plateforme)"}, {"id": "K57", "slug": "higgames", "theme": "I", "status": "sure", "title": "Apple HIG : jouer tout de suite, apprendre en jouant", "text": "Apple HIG, Designing for games : laisser jouer dès l'installation, bons réglages par défaut, apprendre en jouant.", "sources": ["Apple, Human Interface Guidelines, « Designing for games » : https://developer.apple.com/design/human-interface-guidelines/designing-for-games"], "origin": "reprise JdS K405 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K58", "slug": "higcontrols", "theme": "I", "status": "sure", "title": "Apple HIG : toucher pour sélectionner, commandes près du pouce", "text": "Apple HIG, Game controls : toucher les objets pour les sélectionner, boutons fréquents près du pouce, retours visuels.", "sources": ["Apple, Human Interface Guidelines, « Game controls » : https://developer.apple.com/design/human-interface-guidelines/game-controls"], "origin": "reprise JdS K406 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K59", "slug": "hoober", "theme": "I", "status": "sure", "title": "Hoober (2013) : une main 49 %", "text": "Sur 780 personnes observées en train de toucher l'écran : une main 49 %, téléphone tenu à deux mains et touché d'une seule 36 %. Un tracé de trajet doit se faire au pouce, d'une main.", "sources": ["Steven Hoober, « How Do Users Really Hold Mobile Devices? », UXmatters, 18/02/2013 : https://www.uxmatters.com/mt/archives/2013/02/how-do-users-really-hold-mobile-devices.php"], "origin": "reprise JdS K408 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K60", "slug": "ecran44", "theme": "I", "status": "sure", "title": "iPhone : 393 pt de large, cible tactile ≥ 44 pt", "text": "iPhone 16 : 393 × 852 points ; iPhone 16 Pro Max : 440 × 956 points. Cible tactile Apple : au moins 44 × 44 pt.", "sources": ["https://useyourloaf.com/blog/iphone-16-screen-sizes/"], "origin": "reprise JdS K525 (CK/base-K.md du JdS, § Technique & plateforme)"}, {"id": "K61", "slug": "couleurseule", "theme": "I", "status": "sure", "title": "Apple : ne pas coder par la couleur seule", "text": "Apple : ne pas obliger à distinguer des états par la seule couleur ; le daltonisme est fréquent. Pions noirs et blancs : bon point ; terrain colorié : prévoir un motif.", "sources": ["https://developer.apple.com/help/app-store-connect/manage-app-accessibility/differentiate-without-color-alone-evaluation-criteria/"], "origin": "reprise JdS K526 (CK/base-K.md du JdS, § Technique & plateforme)"}, {"id": "K62", "slug": "petitecran", "theme": "I", "status": "sure", "title": "Petit écran, UI chargée", "text": "Gladiabots est critiqué pour une interface trop chargée sur iPhone : la profondeur doit tenir dans un petit écran.", "sources": ["https://www.tapsmart.com/games/gladiabots-build-ai-robot-warriors/"], "origin": "reprise JdS K134 (CK/base-K.md du JdS, § Technique & plateforme)"}, {"id": "K63", "slug": "testflightlim", "theme": "P", "status": "sure", "title": "TestFlight : 100 testeurs internes, 10 000 externes", "text": "Apple : jusqu'à 100 testeurs internes et jusqu'à 10 000 externes après une revue de la bêta.", "sources": ["Apple Developer, « TestFlight » : https://developer.apple.com/testflight/"], "origin": "reprise JdS K451 (CK/base-K.md du JdS, § Technique & plateforme)"}, {"id": "K64", "slug": "iapapple", "theme": "M", "status": "sure", "title": "App Store 3.1.1 : achats intégrés obligatoires", "text": "Pour débloquer des fonctions ou une monnaie de jeu, il faut passer par l'achat intégré d'Apple.", "sources": ["Apple, App Store Review Guidelines, 3.1.1 In-App Purchase (mise à jour du 16/10/2026) : https://developer.apple.com/app-store/review/guidelines/"], "origin": "reprise JdS K409 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K65", "slug": "schell", "theme": "B", "status": "sure", "title": "Schell : équité et choix significatifs", "text": "Lentille de l'équité (symétrie ?) et des choix significatifs. Un duel simultané symétrique sur 9×9 est équitable par construction.", "sources": ["Schell, lentilles n° 30 (Fairness) et n° 32 (Meaningful Choice), transcription : https://gamefroot-developer.gitbooks.io/jesse-schell-the-art-of-game-design-lenses-1-to-1/content/030.html et https://gamefroot-developer.gitbooks.io/jesse-schell-the-art-of-game-design-lenses-1-to-1/content/032.html"], "origin": "reprise JdS K392 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K66", "slug": "koster", "theme": "B", "status": "sure", "title": "Koster : le fun, c'est la réponse émotionnelle à l'apprentissage", "text": "Pour Koster, le fun naît de l'apprentissage ; un jeu dont on a fait le tour lasse. Argument pour la profondeur.", "sources": ["Raph Koster, « Theory of Fun: 10 Years Later », GDC Online 2012 (diapositives de l'auteur) : https://raphkoster.com/gaming/gdco12/Koster_Raph_Theory_Fun_10.pdf"], "origin": "reprise JdS K395 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K67", "slug": "meaningful", "theme": "B", "status": "sure", "title": "Salen et Zimmerman : lien action-résultat discernable", "text": "Le jeu a du sens si le lien entre l'action du joueur et le résultat est discernable et intégré. Une annulation mutuelle doit rester lisible.", "sources": ["Katie Salen et Eric Zimmerman, Rules of Play (MIT Press, 2003), définitions de la « meaningful play » citées par Wikipédia : https://en.wikipedia.org/wiki/Meaningful_play"], "origin": "reprise JdS K397 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K68", "slug": "hsiterer", "theme": "B", "status": "sure", "title": "Hearthstone : itérer vite sur papier, simplifier sans perdre la profondeur", "text": "Dodds (GDC 2014) : prototypes papier puis numériques, beaucoup de mauvaises idées essayées puis jetées. QIDIGO se teste sur un goban 9×9 réel.", "sources": ["« 'Iterate fast' and other design lessons learned from Hearthstone », Game Developer (compte rendu de la conférence d'Eric Dodds, GDC 2014) : https://www.gamedeveloper.com/design/-iterate-fast-and-other-design-lessons-learned-from-i-hearthstone-i-", "vidéo : https://www.gdcvault.com/play/1020775/Hearthstone-10-Bits-of-Design"], "origin": "reprise JdS K399 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K69", "slug": "contrejeu", "theme": "B", "status": "sure", "title": "Riot : le contre-jeu", "text": "Le contre-jeu est une action ou une stratégie qui permet de surmonter une menace adverse ; il sert l'équité et la profondeur. La coupure de trajet est un contre-jeu.", "sources": ["Riot Scruffy, « Quick Gameplay Thoughts: May 14 », League of Legends (Riot Games), 14/05/2021 : https://www.leagueoflegends.com/en-us/news/dev/quick-gameplay-thoughts-may-14/"], "origin": "reprise JdS K402 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K70", "slug": "bushnell", "theme": "B", "status": "sure", "title": "Loi de Bushnell : facile à apprendre, difficile à maîtriser", "text": "Les meilleurs jeux sont faciles à apprendre et difficiles à maîtriser (Bushnell) ; critique de Bogost sur l'aphorisme.", "sources": ["« Bushnell's Law », Wikipédia : https://en.wikipedia.org/wiki/Bushnell%27s_Law", "Ian Bogost, « Persuasive Games: Familiarity, Habituation, and Catchiness », Game Developer : https://www.gamedeveloper.com/design/persuasive-games-familiarity-habituation-and-catchiness"], "origin": "reprise JdS K403 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K71", "slug": "darkpatterns", "theme": "B", "status": "sure", "title": "Zagal et al. (2013) : dark patterns (temps, argent, social)", "text": "Patrons conçus pour nuire au joueur contre son intérêt. Cohérent avec K1 et K3 : rien de tel dans QIDIGO.", "sources": ["José P. Zagal, Staffan Björk et Chris Lewis, « Dark Patterns in the Design of Games », Foundations of Digital Games (FDG) 2013 : http://www.fdg2013.org/program/papers/paper06_zagal_etal.pdf"], "origin": "reprise JdS K410 (CK/base-K.md du JdS, § Bonnes pratiques de game design (demande de Lomig via CDP, tour 17))"}, {"id": "K72", "slug": "intobreach", "theme": "B", "status": "sure", "title": "Into the Breach : l'ennemi annonce ses coups", "text": "Into the Breach télégraphie toutes les attaques ennemies : le combat devient une énigme lisible. Piste : montrer les trajets possibles adverses ? (contraire au secret des ordres).", "sources": ["https://www.subsetgames.com/itb.html", "https://www.gamedeveloper.com/game-platforms/road-to-the-igf-subset-games-i-into-the-breach-i-", "https://en.wikipedia.org/wiki/Into_the_Breach"], "origin": "reprise JdS K341 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K73", "slug": "clarte", "theme": "B", "status": "sure", "title": "Into the Breach : la clarté avant les bonnes idées", "text": "Justin Ma : ils sacrifiaient les bonnes idées au profit de la clarté ; le joueur doit comprendre ce qui se passe dans toute situation. Critère direct pour choisir les règles de coupure.", "sources": ["https://www.gamedeveloper.com/design/-i-into-the-breach-i-dev-on-ui-design-sacrifice-cool-ideas-for-the-sake-of-clarity-every-time-", "https://www.youtube.com/watch?v=s_I07Iq_2XM"], "origin": "reprise JdS K505 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K74", "slug": "cowan", "theme": "B", "status": "sure", "title": "Cowan (2001) : environ quatre éléments en mémoire de travail", "text": "Cowan estime la capacité de la mémoire à court terme à environ quatre « chunks ». Argument pour peu de pions à suivre (5 plutôt que 8 ?).", "sources": ["https://doi.org/10.1017/s0140525x01003922"], "origin": "reprise JdS K527 (CK/base-K.md du JdS, § Psychologie du joueur)"}, {"id": "K75", "slug": "infoparfaite", "theme": "B", "status": "sure", "title": "Information parfaite : les échecs oui, les coups simultanés non", "text": "Les échecs sont à information parfaite ; un jeu à coups simultanés ne l'est pas (chacun ignore le coup de l'autre). QIDIGO ajoute une part de lecture de l'adversaire.", "sources": ["https://en.wikipedia.org/wiki/Perfect_information"], "origin": "reprise JdS K368 (CK/base-K.md du JdS, § Théorie du jeu / Caillois (demande de Lomig via CDP, tour 15))"}, {"id": "K76", "slug": "agon", "theme": "B", "status": "sure", "title": "Échecs : un agôn presque pur", "text": "Caillois prend les échecs comme exemple d'agôn (compétition pure). QIDIGO, sans hasard, vise aussi l'agôn.", "sources": ["https://en.wikipedia.org/wiki/Man,_Play_and_Games", "Roger Caillois, Les Jeux et les Hommes, Gallimard, 1958, scan de l'édition originale (OCR relu, coquilles corrigées) : https://monoskop.org/images/4/41/Caillois_Roger_Les_jeux_et_les_hommes_1958.pdf", "https://en.wikipedia.org/wiki/Perfect_information"], "origin": "reprise JdS K369 (CK/base-K.md du JdS, § Théorie du jeu / Caillois (demande de Lomig via CDP, tour 15))"}, {"id": "K77", "slug": "dipordres", "theme": "S", "status": "sure", "title": "Diplomacy : ordres écrits en secret, révélés et résolus ensemble", "text": "Chaque joueur écrit en secret un ordre par unité (tenir, bouger, soutenir, convoyer) ; tout est révélé puis résolu ensemble ; un ordre absent vaut « tenir ».", "sources": ["https://media.wizards.com/2015/downloads/ah/diplomacy_rules.pdf", "https://renegadegamestudios.com/content/File%20Storage%20for%20site/Rulebooks/Diplomacy/DiplomacyRGS_Rulebook_v6_LR.pdf"], "origin": "reprise JdS K323 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K78", "slug": "dipstandoff", "theme": "S", "status": "sure", "title": "Diplomacy : à force égale, personne n'avance (standoff)", "text": "Quand des unités de même force visent la même province, aucune ne bouge ; un blocage ne déloge pas l'unité déjà présente. C'est l'ancêtre direct de « coupé = les deux ordres annulés ».", "sources": ["https://media.wizards.com/2015/downloads/ah/diplomacy_rules.pdf"], "origin": "reprise JdS K345 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K79", "slug": "dipcentres", "theme": "S", "status": "sure", "title": "Diplomacy : des cases qui valent plus", "text": "34 centres de ravitaillement ; pas plus d'unités que de centres tenus ; il en faut 18 pour gagner. Précédent d'une réserve d'unités liée au terrain (C5.4).", "sources": ["https://www.playdiplomacy.com/help.php?sub_page=Game_Rules", "https://www.hasbro.com/common/instruct/diplomacy.pdf"], "origin": "reprise JdS K518 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K80", "slug": "wego", "theme": "S", "status": "sure", "title": "Tours simultanés (« WeGo ») : la pression porte sur le plan", "text": "Lines of Battle : en tours simultanés, on s'engage sans savoir, le bluff devient réel, personne n'a le dernier mot ; la pression du temps porte sur la planification, pas sur le clic.", "sources": ["https://linesofbattle.net/simultaneous-turns"], "origin": "reprise JdS K349 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K81", "slug": "atlas", "theme": "S", "status": "sure", "title": "Atlas Reactor : 20 s pour décider, puis résolution en phases fixes", "text": "Tous verrouillent leurs actions pendant une décision chronométrée (20 s), puis la résolution suit un ordre fixe de phases.", "sources": ["http://webcdn.triongames.com/atlasreactor/AtlasReactor_Guide.pdf", "https://atlas-reactor.fandom.com/wiki/Phases"], "origin": "reprise JdS K342 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K82", "slug": "frozenmanuel", "theme": "S", "status": "sure", "title": "Frozen Synapse : qui gagne un face-à-face, replay de chaque tour", "text": "Les deux planifient, valident, puis regardent un tour d'environ 5 s ; on peut revoir chaque tour passé. Modèle pour l'animation des trajets de QIDIGO.", "sources": ["http://icebrain.free.fr/guides/official-manual/", "https://en.wikipedia.org/wiki/Frozen_Synapse_(video_game)"], "origin": "reprise JdS K344 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K83", "slug": "frozen", "theme": "S", "status": "sure", "title": "Frozen Synapse : planifier, simuler, valider, exécuter", "text": "Planification simultanée, simulation possible en supposant le coup adverse, puis exécution déterministe d'environ 5 s.", "sources": ["https://en.wikipedia.org/wiki/Frozen_Synapse_(video_game)", "https://blog.playstation.com/archive/2014/09/10/new-frozen-synapse-prime-video-explains-combat-mechanics-2", "https://store.steampowered.com/app/98200/Frozen_Synapse/"], "origin": "reprise JdS K324 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K84", "slug": "kungfu", "theme": "S", "status": "sure", "title": "Kung-Fu Chess : échecs sans tours", "text": "Échecs en temps réel où chaque pièce jouée a un temps de recharge. Montre qu'un abstrait classique tolère qu'on supprime l'alternance.", "sources": ["https://www.kungfuchess.org/about", "https://www.kungfuchess.org/faq", "https://en.wikipedia.org/wiki/Kung-fu_chess"], "origin": "reprise JdS K202 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K85", "slug": "deterministe", "theme": "P", "status": "creuser", "title": "Simulation déterministe par ticks", "text": "Clash Royale semble utiliser une simulation déterministe : seules les commandes transitent. QIDIGO (ordres + résolution déterministe) s'y prête encore mieux : on n'envoie qu'un ordre par tour.", "sources": ["piste : https://blog.gemserk.com/2016/09/05/analyzing-clash-royale-multiplayer-solution/"], "origin": "reprise JdS K130 (CK/base-K.md du JdS, § Décomposition d'objets existants)"}, {"id": "K86", "slug": "gojds", "theme": "G", "status": "sure", "title": "Go : gagner par le territoire", "text": "Au go, on gagne en contrôlant plus de territoire (intersections encerclées, plus prisonniers selon le décompte).", "sources": ["https://en.wikipedia.org/wiki/Go_%28game%29"], "origin": "reprise JdS K224 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K87", "slug": "deuxyeux", "theme": "G", "status": "sure", "title": "Go : un groupe à deux yeux ne peut plus être pris", "text": "Un groupe qui a deux yeux vrais et séparés est vivant : c'est une « zone sûre pour de bon » obtenue par la forme, sans règle spéciale.", "sources": ["https://senseis.xmp.net/?TwoEyes", "https://www.learn-go.net/lessons/06/"], "origin": "reprise JdS K330 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K88", "slug": "splatoon", "theme": "T", "status": "sure", "title": "Splatoon : Guerre de territoire (% de surface encrée)", "text": "Deux équipes ont trois minutes pour encrer le terrain ; au gong, l'équipe qui couvre le plus de surface gagne. Précédent de « peindre en passant » (C1.4).", "sources": ["https://splatoonwiki.org/wiki/Turf_War", "https://www.nintendo.com/en-gb/News/2024/December/Beginner-basics-for-Splatoon-3-the-ins-and-outs-of-playing-online-2645154.html", "https://www.youtube.com/watch?v=aiuIZN0KDFQ"], "origin": "reprise JdS K266 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K89", "slug": "paperio", "theme": "T", "status": "sure", "title": "Paper.io 2 : le score est le % de la carte possédé", "text": "On part d'un petit territoire ; dehors on laisse une trace, et revenir chez soi annexe la zone tracée ; si un adversaire coupe la trace, on perd tout. Précédent direct du trajet qui ferme une zone.", "sources": ["https://www.gamedeveloper.com/design/paper-io-2-a-natural-difficulty-curve", "https://apps.apple.com/us/app/paper-io-2/id1423046460"], "origin": "reprise JdS K267 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K90", "slug": "qixjds", "theme": "Q", "status": "sure", "title": "Qix : finir le niveau en prenant 75 % de l'écran", "text": "On trace des lignes pour fermer des zones ; il faut réclamer 75 % de l'aire (réglable de 50 à 90 % selon Wikipédia) pour finir un niveau.", "sources": ["https://en.wikipedia.org/wiki/Qix", "https://archive.org/stream/ArcadeGameManualQix/qix_djvu.txt"], "origin": "reprise JdS K268 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K91", "slug": "ingress", "theme": "T", "status": "sure", "title": "Ingress : trois balises reliées créent un champ ; les liens ne se croisent pas", "text": "On relie des portails de sa faction ; trois portails reliés créent un champ de contrôle ; un lien ne peut pas en croiser un autre. Précédent de « croiser = interdit / couper ».", "sources": ["https://support.ingress.com/hc/en-us/articles/41140344104219-Creating-Links-and-Fields"], "origin": "reprise JdS K331 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K92", "slug": "polytopia30", "theme": "T", "status": "sure", "title": "Polytopia : cases carrées, mode en 30 tours", "text": "Polytopia se joue sur des cases carrées ; un mode se joue en 30 tours (meilleur score). Précédent d'une fin par nombre de tours fixe.", "sources": ["https://en.wikipedia.org/wiki/The_Battle_of_Polytopia", "https://polytopia.fandom.com/wiki/Map_Generation"], "origin": "reprise JdS K347 (CK/base-K.md du JdS, § Genres & mécaniques)"}, {"id": "K93", "slug": "pitch", "theme": "L", "status": "sure", "title": "Pitch QIDIGO : Qix + Diplomacy + Go", "text": "Décision de Lomig relayée par CDP : un mélange de Qix (gagner du terrain), de Diplomacy (donner des ordres, puis tout se résout en même temps) et de Go (on joue sur les croisements d'une grille de traits 9×9, pions noirs et blancs). Les règles sont incomplètes : c'est l'objet du C-K. But : simple, rapide, profond.", "sources": ["décision de Lomig relayée par CDP, 03/11/2026", "DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Pitch"], "origin": "dépôt QIDIGO"}, {"id": "K94", "slug": "b1", "theme": "L", "status": "sure", "title": "On joue sur les 81 intersections d'une grille de traits 9×9", "text": "BRIEF, point 1 : plateau = grille de traits 9×9 ; on joue sur les intersections, pas dans les cases.", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui est posé, 1"], "origin": "dépôt QIDIGO"}, {"id": "K95", "slug": "b2", "theme": "L", "status": "sure", "title": "Deux joueurs : noirs contre blancs", "text": "BRIEF, point 2 : deux joueurs, noirs contre blancs.", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui est posé, 2"], "origin": "dépôt QIDIGO"}, {"id": "K96", "slug": "b3", "theme": "L", "status": "sure", "title": "X pions par joueur, X non fixé (5 ? 8 ?)", "text": "BRIEF, point 3 : chaque joueur dispose de X pions ; X n'est pas fixé (5 ? 8 ?).", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui est posé, 3"], "origin": "dépôt QIDIGO"}, {"id": "K97", "slug": "b4", "theme": "L", "status": "sure", "title": "Chaque tour : poser un nouveau pion OU déplacer un pion", "text": "BRIEF, point 4 : à chaque tour, chaque joueur choisit de poser un nouveau pion ou de déplacer un pion déjà en place.", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui est posé, 4"], "origin": "dépôt QIDIGO"}, {"id": "K98", "slug": "b5", "theme": "L", "status": "sure", "title": "Déplacer = dessiner un trajet jusqu'au point d'arrivée", "text": "BRIEF, point 5 : pour déplacer un pion, le joueur dessine un trajet sur la grille jusqu'au point d'arrivée.", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui est posé, 5"], "origin": "dépôt QIDIGO"}, {"id": "K99", "slug": "b67", "theme": "L", "status": "sure", "title": "Trajet non coupé : le déplacement a lieu ; coupé : les deux déplacements sont annulés", "text": "BRIEF, points 6 et 7 : si aucun ordre adverse ne coupe le trajet, le déplacement a lieu ; sinon le déplacement est annulé, et celui de l'adversaire aussi.", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui est posé, 6–7"], "origin": "dépôt QIDIGO"}, {"id": "K100", "slug": "bouvert", "theme": "L", "status": "sure", "title": "Ce qui reste ouvert selon le BRIEF", "text": "BRIEF, § Ce qui reste ouvert : le nombre X ; comment on gagne du terrain (zones fermées, comptage, territoire) ; ce qui compte comme « couper » (croisement de trajets, arrivée sur un trajet, pose sur un trajet…) ; la fin de partie et la victoire ; le rythme d'un tour (chrono ? ordres simultanés en secret ?) ; le nom définitif (QIDIGO est un nom de travail).", "sources": ["DOCS/BRIEF.md (dépôt blomig/QIDIGO, commit e88023f), § Ce qui reste ouvert"], "origin": "dépôt QIDIGO"}, {"id": "K101", "slug": "ckdedie", "theme": "L", "status": "sure", "title": "QIDIGO a son propre C-K, qui reprend les K utiles du JdS", "text": "Décision du 03/11/2026 : QIDIGO a son propre C-K dans CK/, ce n'est pas une branche du C-K du Jeu du siècle ; il reprend les K utiles du JdS (ordres simultanés, résolution, rythme, tests). Pas de code tant que Lomig n'a pas ouvert la phase maquette.", "sources": ["DOCS/DECISIONS.md (dépôt blomig/QIDIGO, commit e88023f), 2026-11-03"], "origin": "dépôt QIDIGO"}, {"id": "K102", "slug": "pasunautrejeu", "theme": "L", "status": "sure", "title": "Ce n'est ni BLOMIX, ni JeuDuDico, ni GooBots, ni le Jeu du siècle", "text": "AGENTS.md : on ne copie ni leurs règles, ni leur palette, ni leur code. Ne pas inventer les règles : tant qu'il n'existe pas de DOCS/RULES.md figé, tout ce qui est écrit n'est que pistes.", "sources": ["AGENTS.md (dépôt blomig/QIDIGO, commit e88023f)"], "origin": "dépôt QIDIGO"}, {"id": "K103", "slug": "portrait", "theme": "I", "status": "sure", "title": "Plateforme visée : iPhone, en portrait", "text": "AGENTS.md : plateforme visée iPhone, portrait ; plus tard Swift 6, iOS 18 (rien avant la phase maquette).", "sources": ["AGENTS.md (dépôt blomig/QIDIGO, commit e88023f)"], "origin": "dépôt QIDIGO"}, {"id": "K104", "slug": "questionsformat", "theme": "L", "status": "sure", "title": "Questions à Lomig : courtes, numérotées, options a) / b)", "text": "AGENTS.md : les questions à Lomig sont courtes, numérotées, avec des options a) / b) ; ses réponses vont dans DOCS/DECISIONS.md.", "sources": ["AGENTS.md (dépôt blomig/QIDIGO, commit e88023f)"], "origin": "dépôt QIDIGO"}, {"id": "K105", "slug": "captureslomig", "theme": "L", "status": "sure", "title": "Captures de pions ; un pion capturé retourne dans la réserve de son propriétaire", "text": "Décision de Lomig relayée par CDP (03/11/2026, 7 h 04) : il veut des captures de pions (« comme au Go ? »). Un pion capturé n'est pas perdu : il retourne dans la réserve de son propriétaire, qui peut le rejouer. Seule la parenthèse est citée mot pour mot ; le reste est la formulation de CDP.", "sources": ["décision de Lomig relayée par CDP, 03/11/2026, 7 h 04"], "origin": "Lomig via CDP"}, {"id": "K106", "slug": "finlomig", "theme": "L", "status": "sure", "title": "Fin : après un nombre de coups, ou au-delà de X % de la grille, ou au premier des deux", "text": "Décision ouverte de Lomig relayée par CDP (03/11/2026, 7 h 06, formulation de CDP) : la partie pourrait se terminer après un certain nombre de coups, ou quand un joueur possède plus de X % de la grille, ou au premier des deux. Rien n'est tranché entre les trois.", "sources": ["décision ouverte de Lomig relayée par CDP, 03/11/2026, 7 h 06"], "origin": "Lomig via CDP"}, {"id": "K107", "slug": "lecon", "theme": "L", "status": "sure", "title": "Leçon du JdS : « compliqué et lent », caractéristiques des cartes sous-utilisées", "text": "Constat de Lomig relayé par CDP (03/11/2026) : le Jeu du siècle est compliqué et lent, et n'utilise pas assez les caractéristiques de ses cartes ; il est mis en pause. Principe général transposé : chaque règle et chaque paramètre de QIDIGO doit servir le jeu ; viser moins de règles et des parties plus courtes.", "sources": ["constat de Lomig relayé par CDP, 03/11/2026"], "origin": "Lomig via CDP"}, {"id": "K108", "slug": "trente", "theme": "L", "status": "sure", "title": "JdS : chrono de 30 s (décision du 31/10), 15 tours ≈ 8 min 45 s au plus", "text": "Règles v0.3 du JdS, R-5.2b : le chrono de planification dure 30 s (décision de Lomig du 31/10/2026, relayée par CDP ; K32 disait « 15s? ») ; une partie de 15 tours dure 15 × (30 + 5) = 525 s, soit environ 8 min 45 s au plus. Le JdS est jugé « compliqué et lent » (K107) ; cette durée en est un repère. Pour QIDIGO, le rythme est ouvert (BRIEF) : ce n'est pas une décision QIDIGO.", "sources": ["/workspace/jds-patch-out/regles-v0.3-recharge.patch, R-5.2b (JdS)"], "origin": "règles du JdS"}, {"id": "K109", "slug": "appuidirect", "theme": "I", "status": "sure", "title": "JdS : ordres par appui direct sur les cases surlignées, sans mini-menu", "text": "Règles v0.3 du JdS, R-13.2 : décision de Lomig du 31/10/2026, relayée par CDP : on donne un ordre en appuyant sur l'unité puis sur une case surlignée, sans mini-menu (JdS-K420 remplacée). Principe transposable : geste direct, pas de menu.", "sources": ["/workspace/jds-patch-out/regles-v0.3-recharge.patch, R-13.2, R-5.7 (JdS)"], "origin": "règles du JdS"}, {"id": "K110", "slug": "pret", "theme": "L", "status": "creuser", "title": "JdS : bouton « Prêt » pour finir sa planification avant le chrono (proposition)", "text": "Règles v0.3 du JdS, R-5.3, PROPOSITION P-19 (pas une décision) : un bouton « Prêt » met fin à la planification ; contre l'IA, la résolution démarre aussitôt.", "sources": ["/workspace/jds-patch-out/regles-v0.3-recharge.patch, R-5.3 (JdS)"], "origin": "règles du JdS"}, {"id": "K111", "slug": "iaregles", "theme": "P", "status": "creuser", "title": "JdS : une IA faible simple (proposition P-43, ai_idle_prob = 0,25)", "text": "Règles v0.2 du JdS, R-12.1 (PROPOSITION P-43) : l'IA ne lit que l'état public du début du tour, donne ses ordres au début de la planification, et avec une probabilité ai_idle_prob = 0,25 une unité ne fait rien. Modèle direct pour une IA de prototype QIDIGO.", "sources": ["/workspace/JeuDuSiecle/CK/regles-v0.md, R-12.1 (JdS)"], "origin": "règles du JdS"}, {"id": "K112", "slug": "golib", "theme": "G", "status": "sure", "title": "Go : libertés et capture", "text": "Les libertés d'un pion (pierre) sont les intersections vides adjacentes ; une chaîne qui n'a plus de liberté est capturée ; les pierres ne bougent jamais.", "sources": ["https://en.wikipedia.org/wiki/Go_(game)", "https://en.wikipedia.org/wiki/Rules_of_Go"], "origin": "externe"}, {"id": "K113", "slug": "goaire", "theme": "G", "status": "sure", "title": "Go : décompte par aire ou par territoire", "text": "Décompte par aire (règles chinoises) : pierres vivantes + intersections vides entourées ; par territoire (japonais) : vides entourés + prisonniers. Les deux donnent le plus souvent le même résultat.", "sources": ["https://en.wikipedia.org/wiki/Rules_of_Go"], "origin": "externe"}, {"id": "K114", "slug": "gopasses", "theme": "G", "status": "sure", "title": "Go : la partie finit par deux passes consécutives", "text": "Au go, la partie se termine quand les deux joueurs passent l'un après l'autre.", "sources": ["https://en.wikipedia.org/wiki/Rules_of_Go"], "origin": "externe"}, {"id": "K115", "slug": "gosuicide", "theme": "G", "status": "sure", "title": "Go : le suicide, permis ou interdit selon les règles", "text": "Les règles de base (Tromp–Taylor) permettent le suicide (auto-capture) ; c'est inhabituel hors de Taïwan et de Nouvelle-Zélande ; une règle optionnelle l'interdit.", "sources": ["https://en.wikipedia.org/wiki/Rules_of_Go"], "origin": "externe"}, {"id": "K116", "slug": "goko", "theme": "G", "status": "sure", "title": "Go : ko simple, superko positionnel et situationnel", "text": "La règle du ko simple interdit de recréer la position précédente ; le superko interdit de recréer n'importe quelle position antérieure. Superko positionnel (PSK) : la position seule ; situationnel (SSK) : la position et le joueur au trait. Sans superko, un triple ko donne un cycle sans fin et « pas de résultat ».", "sources": ["https://en.wikipedia.org/wiki/Rules_of_Go", "https://en.wikipedia.org/wiki/Ko_fight"], "origin": "externe"}, {"id": "K117", "slug": "goseki", "theme": "G", "status": "sure", "title": "Go : seki (vie mutuelle)", "text": "Un groupe est vivant en seki s'il n'est pas indépendamment vivant mais ne peut pas être capturé ; les règles japonaises et coréennes ont des dispositions spéciales pour les points en seki.", "sources": ["https://en.wikipedia.org/wiki/Rules_of_Go"], "origin": "externe"}, {"id": "K118", "slug": "gokomi", "theme": "G", "status": "sure", "title": "Go : komi de 6,5 ou 7,5 points", "text": "Komi standard : 6,5 points (règles japonaises, coréennes), 7,5 (chinoises, Ing, AGA), 7 (Nouvelle-Zélande). Il compense l'avantage du premier coup ; une valeur fractionnaire évite le nul. En simultané, il n'y a pas de premier coup.", "sources": ["https://en.wikipedia.org/wiki/Komi_(Go)"], "origin": "externe"}, {"id": "K119", "slug": "go9", "theme": "G", "status": "sure", "title": "Go : 9×9 = 81 points, pour débuter ou finir vite", "text": "Le 9×9 et le 13×13 servent aux débutants et aux joueurs qui veulent une partie qui finit plus vite.", "sources": ["https://en.wikipedia.org/wiki/Go_(game)", "https://en.wikipedia.org/wiki/Go_variants"], "origin": "externe"}, {"id": "K120", "slug": "go9duree", "theme": "G", "status": "creuser", "title": "Go 9×9 : environ 58 coups jusqu'au décompte ; 10 à 30 min selon les sources", "text": "Forum OGS : mesure d'environ 58 coups (les deux joueurs) jusqu'au décompte en 9×9, soit 71,6 % des 81 points ; FirstGo : 10 à 20 min en partie détendue ; play-go-online.com : 20 à 30 min, 40 à 60 coups. Sources secondaires (forum, sites), d'où « à creuser ».", "sources": ["https://forums.online-go.com/t/average-game-length-on-different-board-sizes/35042", "https://firstgo.app/blog/go-board-sizes", "https://play-go-online.com/play/9x9/"], "origin": "externe"}, {"id": "K121", "slug": "ing", "theme": "G", "status": "sure", "title": "Règles Ing : 180 pierres chacun, les prisonniers reviennent à leur propriétaire", "text": "Règles Ing (SST) : chaque joueur a exactement 180 pierres ; les pierres capturées sont rendues à leur propriétaire (« returned to the opponent's bowl » pour le preneur) ; le décompte se fait en remplissant son territoire. Seul précédent trouvé, au go, de pions capturés qui reviennent à leur propriétaire ; mais avec 180 pierres, la réserve ne manque pas : la question de la répétition ne s'y pose pas comme dans QIDIGO.", "sources": ["https://en.wikipedia.org/wiki/Rules_of_Go", "https://www.cs.cmu.edu/~wjh/go/rules/KSS.html", "https://senseis.xmp.net/?IngRules"], "origin": "externe"}, {"id": "K122", "slug": "qix", "theme": "Q", "status": "sure", "title": "Qix : tracer pour fermer des zones ; le trait non fini est vulnérable", "text": "Qix : on trace des lignes (Stix) pour fermer des zones, qui se remplissent de couleur ; les zones prises en Slow Draw valent double ; les Sparx parcourent les bords sauf les Stix non finis, mais les Super Sparx peuvent poursuivre le joueur sur un Stix non fini. Le trait en cours est le moment de risque.", "sources": ["https://en.wikipedia.org/wiki/Qix"], "origin": "externe"}, {"id": "K123", "slug": "qixclones", "theme": "Q", "status": "sure", "title": "Qix a été très cloné (Xonix 1984, Gals Panic 1990, JezzBall 1992…)", "text": "Wikipédia liste de nombreux clones de Qix : Xonix (1984), Gals Panic (1990), JezzBall (1992), Dancing Eyes (1996)… Le « gagner du terrain en traçant » est un genre connu ; la nouveauté devra venir d'ailleurs.", "sources": ["https://en.wikipedia.org/wiki/Qix"], "origin": "externe"}, {"id": "K124", "slug": "volfied", "theme": "Q", "status": "sure", "title": "Volfied : 80 % pour finir ; les ennemis enfermés meurent", "text": "Volfied : il faut réclamer au moins 80 % du niveau (75 % dans Qix, 70 % dans Super Qix) ; les petits ennemis qui se retrouvent dans la zone fermée sont tués. Précédent de « capture par zone fermée ».", "sources": ["https://en.wikipedia.org/wiki/Volfied"], "origin": "externe"}, {"id": "K125", "slug": "jezzball", "theme": "Q", "status": "sure", "title": "JezzBall : capturer en divisant l'espace par des lignes", "text": "JezzBall (Windows, 1992) : on capture des parties d'un rectangle en le divisant par des lignes horizontales ou verticales.", "sources": ["https://en.wikipedia.org/wiki/JezzBall"], "origin": "externe"}, {"id": "K126", "slug": "dipechange", "theme": "S", "status": "sure", "title": "Diplomacy : deux unités ne peuvent pas échanger leurs places", "text": "Règles officielles : deux unités qui visent chacune la province de l'autre ne bougent ni l'une ni l'autre (sauf convoi) ; trois unités ou plus peuvent tourner si aucune n'échange directement. Une unité qui ne bouge pas bloque toute une file (« traffic backup »).", "sources": ["https://media.wizards.com/2015/downloads/ah/diplomacy_rules.pdf"], "origin": "externe"}, {"id": "K127", "slug": "dipsoutien", "theme": "S", "status": "sure", "title": "Diplomacy : un soutien est coupé par une attaque, même ratée", "text": "Un soutien est coupé si l'unité qui soutient est attaquée depuis une autre province que celle où porte le soutien, que l'attaque réussisse ou non ; la force = l'unité + ses soutiens. Précédent de « capture par supériorité numérique ».", "sources": ["https://media.wizards.com/2015/downloads/ah/diplomacy_rules.pdf"], "origin": "externe"}, {"id": "K128", "slug": "dipconvoi", "theme": "S", "status": "sure", "title": "Diplomacy : un convoi échoue si une flotte du convoi est délogée", "text": "Si une flotte qui convoie est délogée pendant le tour, l'armée convoyée reste sur place ; une simple attaque qui ne la déloge pas ne rompt pas le convoi. C'est l'analogue le plus proche d'un « trajet coupé ».", "sources": ["https://media.wizards.com/2015/downloads/ah/diplomacy_rules.pdf"], "origin": "externe"}, {"id": "K129", "slug": "simgame", "theme": "S", "status": "sure", "title": "Théorie des jeux : un jeu simultané", "text": "Un jeu simultané est un jeu où chaque joueur choisit son action sans connaître celle des autres (exemple : pierre-feuille-ciseaux).", "sources": ["https://en.wikipedia.org/wiki/Simultaneous_game"], "origin": "externe"}, {"id": "K130", "slug": "dots", "theme": "T", "status": "sure", "title": "Dots (Kropki) : capturer les points adverses en les entourant", "text": "Dots : on place des points sur les croisements d'un papier quadrillé ; une chaîne fermée qui entoure au moins un point adverse le capture ; les zones entourées sont exclues du jeu ; 5 à 90 min.", "sources": ["https://en.wikipedia.org/wiki/Dots_(paper-and-pencil_game)"], "origin": "externe"}, {"id": "K131", "slug": "dotsboxes", "theme": "T", "status": "sure", "title": "Pipopipette (Dots and Boxes) : fermer une case donne un point et un coup de plus", "text": "On trace un trait entre deux points voisins ; celui qui ferme le quatrième côté d'une case marque un point et rejoue.", "sources": ["https://en.wikipedia.org/wiki/Dots_and_boxes"], "origin": "externe"}, {"id": "K132", "slug": "hex", "theme": "T", "status": "sure", "title": "Hex : pas de nul possible ; les pions ne bougent jamais", "text": "Hex : relier ses deux bords ; une fois posés, les pions ne bougent ni ne partent ; le nul est impossible par la topologie du plateau.", "sources": ["https://en.wikipedia.org/wiki/Hex_(board_game)"], "origin": "externe"}, {"id": "K133", "slug": "twixt", "theme": "T", "status": "sure", "title": "TwixT : des liens qui ne se croisent pas ; règle du gâteau", "text": "TwixT : des pions reliés par des liens ; un lien ne peut pas croiser un autre lien ; la règle du gâteau (« pie rule ») compense l'avantage du premier joueur.", "sources": ["https://en.wikipedia.org/wiki/TwixT"], "origin": "externe"}, {"id": "K134", "slug": "amazons", "theme": "T", "status": "sure", "title": "Amazones : déplacer puis murer ; le dernier qui peut bouger gagne", "text": "Une amazone bouge comme une dame aux échecs sans traverser de pièce, puis tire une flèche qui bloque une case pour toujours ; jeu de territoire cousin du go.", "sources": ["https://en.wikipedia.org/wiki/Game_of_the_Amazons"], "origin": "externe"}, {"id": "K135", "slug": "desert", "theme": "T", "status": "sure", "title": "À travers le désert (Knizia) : marquer les zones fermées par ses caravanes", "text": "Jeu de pose où l'on marque des points pour les zones fermées par une de ses caravanes.", "sources": ["https://en.wikipedia.org/wiki/Through_the_Desert"], "origin": "externe"}, {"id": "K136", "slug": "snake", "theme": "T", "status": "sure", "title": "Blockade (1976) / Tron (1982) : survivre en évitant les traces", "text": "Le genre Snake naît avec Blockade (1976), à deux joueurs : survivre plus longtemps que l'autre ; Tron (1982) reprend l'idée avec les motos de lumière.", "sources": ["https://en.wikipedia.org/wiki/Snake_(video_game_genre)"], "origin": "externe"}, {"id": "K137", "slug": "slither", "theme": "T", "status": "sure", "title": "Slither.io : une tête qui touche un autre corps meurt", "text": "Dans Slither.io, si la tête d'un serpent touche le corps d'un autre, il meurt. Précédent d'« interception d'un trajet = capture ».", "sources": ["https://en.wikipedia.org/wiki/Slither.io"], "origin": "externe"}, {"id": "K138", "slug": "morris", "theme": "T", "status": "sure", "title": "Jeu du moulin : une phase de pose, puis une phase de déplacement", "text": "Jeu du moulin : 9 pions chacun sur 24 points ; on pose d'abord tous ses pions, puis on les déplace vers un point voisin ; un moulin (3 alignés) permet de retirer un pion adverse. Précédent ancien d'une réserve limitée qui force à passer de la pose au déplacement.", "sources": ["https://en.wikipedia.org/wiki/Nine_men%27s_morris"], "origin": "externe"}, {"id": "K139", "slug": "hasami", "theme": "T", "status": "sure", "title": "Hasami shogi : capture en tenaille (méthode du gardien)", "text": "On prend une pièce adverse en occupant les deux cases qui l'encadrent sur une ligne ou une colonne ; plusieurs pièces alignées peuvent être prises d'un coup ; entrer soi-même entre deux pièces adverses est sans danger.", "sources": ["https://en.wikipedia.org/wiki/Hasami_shogi"], "origin": "externe"}, {"id": "K140", "slug": "othello", "theme": "T", "status": "sure", "title": "Othello / Reversi : les pions encadrés changent de camp", "text": "Les pions adverses alignés entre le pion posé et un autre pion du joueur sont retournés ; un coup n'est valide que s'il retourne au moins un pion. C'est une conversion, pas une capture.", "sources": ["https://en.wikipedia.org/wiki/Reversi"], "origin": "externe"}, {"id": "K141", "slug": "backgammon", "theme": "T", "status": "sure", "title": "Backgammon : un pion frappé va sur la barre et doit rentrer d'abord", "text": "Un pion seul frappé est placé sur la barre ; il doit rentrer par le jan adverse avant tout autre mouvement. Précédent de pion capturé qui revient en jeu chez son propriétaire, avec une contrainte de retour.", "sources": ["https://en.wikipedia.org/wiki/Backgammon"], "origin": "externe"}, {"id": "K142", "slug": "ludo", "theme": "T", "status": "sure", "title": "Petits chevaux (Ludo) : un pion pris retourne à la maison", "text": "Un pion pris retourne à son point de départ et il faut un 6 pour le remettre en jeu. Précédent de délai avant de rejouer un pion capturé.", "sources": ["https://en.wikipedia.org/wiki/Ludo"], "origin": "externe"}, {"id": "K143", "slug": "shogi", "theme": "T", "status": "sure", "title": "Shogi : les pièces prises sont parachutées par le preneur", "text": "Au shogi, les pièces capturées restent en main du preneur, qui peut les reposer plus tard. Contraste avec QIDIGO, où le pion revient à son propriétaire.", "sources": ["https://en.wikipedia.org/wiki/Shogi"], "origin": "externe"}, {"id": "K144", "slug": "fgo", "theme": "V", "status": "sure", "title": "F-Go : go simultané ; même point = point interdit", "text": "Sensei's Library : les deux joueurs choisissent un point en même temps ; s'ils coïncident, rien n'est joué et le point devient interdit jusqu'au coup suivant ; les captures se jugent sur la position avant le coup ; fin par passe simultanée.", "sources": ["https://senseis.xmp.net/?FGo"], "origin": "externe"}, {"id": "K145", "slug": "fuseki", "theme": "V", "status": "sure", "title": "Fuseki.net : en go simultané, des amas de points interdits", "text": "Simultaneous Go : en cas de collision, les deux reprennent leur pierre et le point est interdit ; l'auteur note que ça marche, sauf de grands amas de zones interdites, et doute de la fin de partie ; le morpion à 5 marche mieux ainsi. Témoignage d'un auteur, pas une étude.", "sources": ["https://fuseki.net/simultaneous-go"], "origin": "externe"}, {"id": "K146", "slug": "dipgo", "theme": "V", "status": "sure", "title": "Diplomatic Go (OGS, 2020) : go simultané à plusieurs, sur 9×9", "text": "Coups scellés exécutés en même temps ; collision = personne ne joue, avec des choix de repli ; captures : d'abord les vieilles chaînes sans liberté, puis les nouvelles (suicide possible) ; fin par passes mutuelles ou position répétée trois fois ; aire, sans komi. Première partie sur 9×9.", "sources": ["https://forums.online-go.com/t/diplomatic-go/29867"], "origin": "externe"}, {"id": "K147", "slug": "sasgo", "theme": "V", "status": "creuser", "title": "SAS Go : collision marquée d'une croix, interdite au tour suivant", "text": "Variante citée sur le forum OGS : si les deux joueurs choisissent le même point, rien n'est posé, le point est marqué X et personne ne peut y jouer au tour suivant. Vu en citation seulement.", "sources": ["https://forums.online-go.com/t/diplomatic-go/29867"], "origin": "externe"}, {"id": "K148", "slug": "parallelgo", "theme": "V", "status": "sure", "title": "Go multijoueur parallèle : coups annoncés ensemble ; chevauchement = passe", "text": "Wikipédia (Go variants) : coups annoncés simultanément ; deux coups qui se chevauchent comptent comme des passes.", "sources": ["https://en.wikipedia.org/wiki/Go_variants"], "origin": "externe"}, {"id": "K149", "slug": "slidinggo", "theme": "V", "status": "sure", "title": "Sliding Go (Pahle) : la pose se fait par un glissement le long des lignes", "text": "Le pion entre par un bord ou à côté d'un groupe relié au bord, puis glisse le long des lignes, en tournant à angle droit, sans traverser de point occupé ; plus de ko, et la plupart des grands yeux vivent. Le plus proche précédent du « trajet dessiné ».", "sources": ["https://jpneto.github.io/world_abstract_games/rules.htm"], "origin": "externe"}, {"id": "K150", "slug": "slideygo", "theme": "V", "status": "sure", "title": "Slidey Go (Jones, 1999) : on peut aussi déplacer un pion d'un cran", "text": "Comme le go, mais un joueur peut aussi déplacer un de ses pions vers un point voisin vide.", "sources": ["https://jpneto.github.io/world_abstract_games/rules.htm"], "origin": "externe"}, {"id": "K151", "slug": "ogsmove", "theme": "V", "status": "evoquee", "title": "Forum OGS : déplacer au lieu de poser semble trop faible", "text": "Spéculation de joueurs (2024) : déplacer un pion d'un cran au lieu d'en poser un semble trop faible, poser étant presque toujours meilleur ; et de petits groupes pourraient vivre partout. Opinion, non testée.", "sources": ["https://forums.online-go.com/t/variant-in-which-the-stones-move/52841"], "origin": "externe"}, {"id": "K152", "slug": "xymyx", "theme": "V", "status": "sure", "title": "XYMYX : échecs simultanés, collisions par hiérarchie", "text": "Les deux joueurs enregistrent leur coup en secret, exécuté en même temps ; deux pièces vers la même case : la plus haute gagne, à égalité celle enregistrée en premier ; une prise échoue si la cible bouge.", "sources": ["https://xymyx.com/en/rules/"], "origin": "externe"}, {"id": "K153", "slug": "gridkings", "theme": "V", "status": "sure", "title": "Grid Kings : Move or Die (iOS) : duel tactique simultané sur grille", "text": "App Store : les deux joueurs planifient en même temps puis les coups se résolvent ; grille 7×12 qui rétrécit ; PvP ou solo ; « parties courtes ». Jeu iPhone proche par le format (simultané, grille, duel).", "sources": ["https://apps.apple.com/us/app/grid-kings-move-or-dir/id6754548572"], "origin": "externe"}, {"id": "K154", "slug": "griddom", "theme": "V", "status": "creuser", "title": "Grid Domination (iPhone) : tours simultanés, routes planifiées, territoire", "text": "Page miroir de l'App Store : mode tours simultanés, on planifie des routes et des ordres, puis tout s'exécute ensemble ; bases capturées et territoire. Vu sur un site tiers seulement.", "sources": ["https://apppage.net/preview/ios/6790938410"], "origin": "externe"}, {"id": "K155", "slug": "yorimichi", "theme": "V", "status": "sure", "title": "Territory Game (Yorimichi, 2026) : prendre une case, murer une zone", "text": "Jeu web : on prend une case voisine de son terrain ; une zone vide que l'adversaire ne peut plus atteindre est à soi ; pas de capture ; fin quand tout est partagé ; plus de cases gagne, égalité = nul.", "sources": ["https://yorimichi-games.com/en/jintori/"], "origin": "externe"}, {"id": "K156", "slug": "ahc061", "theme": "V", "status": "sure", "title": "AtCoder AHC061 (2026) : jeu de territoire simultané, conflits = pièces renvoyées", "text": "Concours de programmation : tous les joueurs choisissent leur destination en même temps ; plusieurs pièces sur une case sans propriétaire : toutes renvoyées à leur case de départ ; score après T = 100 tours.", "sources": ["https://atcoder.jp/contests/ahc061/tasks/ahc061_a?lang=en"], "origin": "externe"}, {"id": "K157", "slug": "d81", "theme": "D", "status": "sure", "title": "Grille 9×9 traits : 81 croisements, 64 cases, 144 segments", "text": "Géométrie : 9 × 9 = 81 croisements ; 8 × 8 = 64 cases entre les traits ; 2 × 9 × 8 = 144 segments unitaires. 75 % de 81 = 60,75 (61 croisements) ; 75 % de 64 = 48 cases.", "sources": ["calcul (K94)"], "origin": "déduction"}, {"id": "K158", "slug": "d44", "theme": "D", "status": "sure", "title": "Sur un iPhone 16 en portrait, un croisement a environ 43,7 pt", "text": "393 pt de large / 9 croisements ≈ 43,7 pt par croisement, sans marge : juste sous les 44 pt recommandés par Apple. Le 9×9 tient à la limite en portrait ; tracer un trajet au doigt, croisement par croisement, sera serré.", "sources": ["calcul (K60, K103)"], "origin": "déduction"}, {"id": "K159", "slug": "doccupes", "theme": "D", "status": "sure", "title": "Avec 5 à 8 pions, « croisements occupés » ne peut pas dépasser 10 %", "text": "5/81 ≈ 6,2 % et 8/81 ≈ 9,9 % : si seule l'occupation compte, aucun seuil de X % significatif n'est atteignable. L'unité de possession doit inclure ce qui est contrôlé ou fermé, pas seulement occupé.", "sources": ["calcul (K96, K157)"], "origin": "déduction"}, {"id": "K160", "slug": "dfinie", "theme": "D", "status": "sure", "title": "Avec retour en réserve, le matériel ne diminue jamais : la fin doit venir d'une règle", "text": "Si chaque pion capturé revient à son propriétaire (K105), aucun joueur ne s'épuise ; et une position peut se répéter (comme un ko). Seule une limite de tours garantit à coup sûr la fin ; un seuil seul ne la garantit pas.", "sources": ["déduction (K105, K116, K106)"], "origin": "déduction"}, {"id": "K161", "slug": "dcollisions", "theme": "D", "status": "creuser", "title": "En go simultané, les collisions sur le meilleur point s'accumulent", "text": "F-Go, Fuseki.net et SAS Go ont tous dû traiter la collision (point interdit) ; Fuseki.net rapporte de grands amas de points interdits. Le risque « tout s'annule » de QIDIGO a donc des précédents.", "sources": ["déduction (K144, K145, K147)"], "origin": "déduction"}, {"id": "K162", "slug": "dtrajetrisque", "theme": "D", "status": "sure", "title": "Trajet long = plus de gain, plus de risque (Qix, Paper.io)", "text": "Dans Qix, le trait non fini est exposé ; dans Paper.io 2, une trace coupée fait tout perdre. Un trajet long dans QIDIGO s'expose plus à la coupure : c'est un équilibrage naturel.", "sources": ["déduction (K122, K89)"], "origin": "déduction"}, {"id": "K163", "slug": "dechange", "theme": "D", "status": "sure", "title": "Le croisement frontal est un conflit dans les deux traditions", "text": "Diplomacy interdit l'échange de places sans convoi ; au JdS, Lomig a décidé que l'échange de cases est un combat (K36). Un face-à-face sur un même segment doit compter comme coupure.", "sources": ["déduction (K126, K36)"], "origin": "déduction"}, {"id": "K164", "slug": "dposefacile", "theme": "D", "status": "creuser", "title": "Si poser ne peut jamais être coupé, poser domine tant qu'il reste des pions en réserve", "text": "Forum OGS : poser est presque toujours mieux que déplacer d'un cran ; jeu du moulin : la réserve limitée force à passer au déplacement. Avec retour en réserve, la réserve se remplit à chaque capture : poser redevient possible.", "sources": ["déduction (K151, K138, K105)"], "origin": "déduction"}, {"id": "K165", "slug": "dduree", "theme": "D", "status": "sure", "title": "Durée maximale = tours × (chrono + résolution)", "text": "Avec 5 s de résolution (valeur du JdS, K32, et ordre de grandeur de Frozen Synapse, K83) : 10 tours × 15 s → 3 min 20 s ; 15 × 15 s → 5 min ; 20 × 15 s → 6 min 40 s ; 20 × 10 s → 5 min ; 15 × 30 s → 8 min 45 s (JdS). Repères : Clash Royale 3 min + jusqu'à 2 min de prolongation (K47) ; Hearthstone 7–10 min (K48).", "sources": ["calcul ( n R-13.2 du JdS.", "cs": "C16 / C16a"}], "dejavu": [{"name": "F-Go", "what": "go simultané, collision = point interdit", "k": "K144"}, {"name": "Simultaneous Go (fuseki.net)", "what": "go simultané, amas de points interdits", "k": "K145"}, {"name": "Diplomatic Go (OGS)", "what": "go simultané multijoueur sur 9×9, contingences, triple répétition", "k": "K146"}, {"name": "SAS Go", "what": "collision marquée X un tour", "k": "K147"}, {"name": "Go multijoueur parallèle", "what": "coups annoncés ensemble", "k": "K148"}, {"name": "Sliding Go", "what": "pose par glissement le long des lignes", "k": "K149"}, {"name": "Slidey Go", "what": "go + déplacement d'un cran", "k": "K150"}, {"name": "Règles Ing", "what": "prisonniers rendus à leur propriétaire", "k": "K121"}, {"name": "XYMYX", "what": "échecs simultanés", "k": "K152"}, {"name": "Grid Kings (iOS)", "what": "duel simultané sur grille", "k": "K153"}, {"name": "Grid Domination (iOS)", "what": "routes planifiées, tours simultanés", "k": "K154"}, {"name": "AtCoder AHC061", "what": "territoire simultané, pièces renvoyées", "k": "K156"}, {"name": "Territory Game (Yorimichi)", "what": "murer une zone, pas de capture", "k": "K155"}, {"name": "Dots / Kropki", "what": "capture par encerclement", "k": "K130"}, {"name": "Paper.io 2", "what": "% de carte, trace coupée", "k": "K89"}, {"name": "Qix et clones (Xonix, JezzBall, Volfied…)", "what": "fermer des zones, seuil 70–80 %", "k": "K123"}, {"name": "TwixT", "what": "liens qui ne se croisent pas", "k": "K133"}, {"name": "Amazones", "what": "déplacer puis murer", "k": "K134"}, {"name": "Hasami shogi", "what": "tenaille", "k": "K139"}, {"name": "Othello", "what": "encadrement", "k": "K140"}, {"name": "Jeu du moulin", "what": "pose puis déplacement", "k": "K138"}]}</script>
<script>
"use strict";
var D=JSON.parse(document.getElementById("ckdata").textContent),KEY="qidigo-ck-v1",LKEY="qidigo-ck-local";
var GISCUS={repo:"blomig/QIDIGO-ck",repoId:"R_kgDOVhAR_A",category:"Announcements",categoryId:"DIC_kwDOVhAR_M4DKRY2"};
var GENERAL="QIDIGO-ck — discussion générale";
function blank(){return {added:[],comments:{},kcomments:{},answers:{}}}
var LOCAL=false;try{LOCAL=localStorage.getItem(LKEY)==="1"}catch(e){}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
["added","comments","kcomments","answers"].forEach(function(k){if(!S[k])S[k]=k==="added"?[]:{}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
