<script type="application/json" id="ckdata">{"version": "qidigo-ck tour 2", "date": "2026-11-03", "c0": "Duel classé 1 contre 1 pour iPhone (portrait), freemium sans pub, sur les 81 croisements d'une grille de traits 9×9 : chaque joueur a 5 pions ; à chaque tour (20 tours de 20 s), les deux joueurs donnent un ordre résolu en même temps — poser un pion, ou déplacer un pion par un trajet glissé au doigt le long des traits ; deux trajets qui passent par un même croisement ou un même segment se coupent, et une pose sur un trajet le coupe ; un trajet coupé est annulé, ainsi que l'ordre adverse (BRIEF) ; on gagne du terrain en fermant des zones avec ses trajets ; un pion adverse enfermé dans une zone est capturé, retourne dans la réserve de son propriétaire et peut être rejoué dès le tour suivant ; la partie finit après 20 tours, ou dès qu'un joueur contrôle 75 % des croisements (61 sur 81) ; ce qu'est une zone reste à explorer ; simple, rapide, profond.", "c0eval": {"forces": ["Les dix réponses de Lomig ferment les trous du tour 1 : le C0 décrit maintenant un jeu presque jouable sur papier.", "Le geste (glisser), le gain (fermer) et la capture (enfermer) sont un seul et même mouvement : très bon pour « simple ».", "La limite de 20 tours garantit la fin malgré le rejeu immédiat (K202).", "Poser ne gagne pas de terrain (K201) : la tension poser/déplacer s'efface en grande partie."], "faiblesses": ["Ce qu'est une zone n'est pas défini (choix volontaire de Lomig) : bord, frontière, traces persistantes, zones mixtes.", "Si l'adversaire peut reposer dans ma zone, la capture ne vaut presque rien (K203).", "L'annulation mutuelle peut toujours bloquer ; une pose qui coupe : a-t-elle lieu ?", "20 × (20 s + 5 s) = 8 min 20 s au plus, proche des 8 min 45 s du JdS (K200).", "43,7 pt ≈ 7,2 mm par croisement, sous les 9,2 mm de Parhi (K195) : la saisie par glissement doit être aimantée."], "verdict": "C0 de tour 2 recevable : l'axe ZONES (C17–C42) et l'ordre de résolution proposé (C56) sont les prochains à trancher ; une maquette papier est possible dès les réponses à Q11–Q14."}, "themes": {"L": "Goûts et décisions de Lomig", "S": "Simultanéité et ordres (Diplomacy)", "G": "Go", "Q": "Qix et clones", "T": "Tracés, territoire et capture", "V": "Déjà-vu (jeux proches)", "C": "Classement", "I": "iPhone et interface", "M": "Marché et monétisation", "B": "Bonnes pratiques de design", "P": "Prototype et technique", "D": "Déductions (K→K)"}, "status": {"sure": "sûre", "creuser": "à creuser", "evoquee": "évoquée"}, "values": {"s": "simple", "r": "rapide", "p": "profond"}, "K": [{"id": "K1", "slug": "freemium", "theme": "L", "status": "sure", "title": "Freemium, zéro pub", "text": "Le jeu est freemium (gratuit puis achats intégrés) et n'a aucune publicité ; c'est non négociable. Vaut tel quel pour QIDIGO.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K2 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K2", "slug": "competition", "theme": "L", "status": "sure", "title": "Compétition et profondeur stratégique", "text": "Lomig aime la compétition et la profondeur stratégique (échecs, Hearthstone) plus que la vitesse des réflexes. La « collection » du JdS tenait aux cartes : elle ne se transpose pas d'office à QIDIGO (pas de cartes).", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K3 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K3", "slug": "recolter", "theme": "L", "status": "sure", "title": "Récolter = gagner (pas de récolte passive)", "text": "Pas de récolte passive (ouvrir le jeu pour ramasser) : tout ce que le joueur reçoit doit venir d'une victoire. Vaut tel quel pour QIDIGO.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K4 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K4", "slug": "echecslents", "theme": "L", "status": "sure", "title": "Échecs lents quotidiens", "text": "Lomig joue aux échecs tous les jours, en partie lente (un coup tous les 3 jours). Il connaît et aime la réflexion au long cours.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K6 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K5", "slug": "blomix", "theme": "L", "status": "sure", "title": "Savoir-faire puzzle : BLOMIX", "text": "Lomig a publié BLOMIX, un jeu de puzzle. Compétence de lisibilité et de « petit plateau » utile pour une grille 9×9.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K8 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K6", "slug": "blomixpas", "theme": "L", "status": "sure", "title": "BLOMIX ne sert pas de socle", "text": "Réponse de Lomig à Q4 (JdS) : BLOMIX n'est pas une base de code ou de jeu à reprendre. On garde le savoir-faire, pas le jeu.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q4"], "origin": "reprise JdS K413 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K7", "slug": "adressedecision", "theme": "L", "status": "sure", "title": "Adresse de décision, pas geste pur", "text": "Lomig ne veut pas d'adresse pure (réflexe, précision du doigt) ; il veut une montée en compétence par la décision. Pour QIDIGO : tracer un trajet doit être un geste trivial, la difficulté est dans le choix du trajet.", "sources": ["Lomig, réponses aux questions Q1–Q3, 25/10/2026"], "origin": "reprise JdS K12 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K8", "slug": "courtprofond", "theme": "L", "status": "sure", "title": "Court + profond", "text": "Piste de départ du JdS : parties courtes ET profondeur stratégique (l'« adresse » est devenue adresse de décision, K7). C'est exactement le « simple, rapide, profond » du pitch QIDIGO.", "sources": ["01-vision-et-gouts.md (déclaration de Lomig)"], "origin": "reprise JdS K9 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K9", "slug": "dureefixe", "theme": "L", "status": "sure", "title": "Parties à durée fixe et courte", "text": "Lomig veut des parties à durée définie et plutôt courte, comme Clash Royale ; les parties longues et variables de Hearthstone sont pour lui un défaut.", "sources": ["Lomig, commentaires dans ck.html, 25/10/2026"], "origin": "reprise JdS K249 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K10", "slug": "vraiaffrontement", "theme": "L", "status": "sure", "title": "Un vrai affrontement, pas « chacun de son côté »", "text": "Lomig refuse le PvP où chacun joue sur son plateau (Rush Royale) : il veut un vrai match où les coups de l'un gênent l'autre. Dans QIDIGO, la coupure de trajet est ce point de contact.", "sources": ["Lomig, commentaires dans ck.html, 25/10/2026"], "origin": "reprise JdS K250 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K11", "slug": "pourcentcarte", "theme": "L", "status": "sure", "title": "Gagner en occupant plus de x % de la carte", "text": "Idée de Lomig (25/10/2026) : le but est d'occuper plus de x % de la carte. Principe transposable tel quel au terrain de la grille 9×9 (la mécanique de « combattants » du JdS ne l'est pas).", "sources": ["Lomig, 25/10/2026, idée originale"], "origin": "reprise JdS K265 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K12", "slug": "plusdeterrain", "theme": "L", "status": "sure", "title": "Plus de terrain au gong, nul possible, pas de base", "text": "Lomig aime qu'à la fin du temps de jeu, celui qui a le plus de terrain gagne, que le nul soit possible, et qu'il n'y ait pas de base de départ ; les nouveaux déploiements ne se font que depuis le terrain possédé. Transposable : « où peut-on poser un pion ? » (C9).", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K319 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K13", "slug": "simultane", "theme": "L", "status": "sure", "title": "Tours simultanés en temps limité, puis exécution", "text": "Réponse de Lomig à Q23 (JdS) : les deux joueurs jouent leur tour en même temps, puis on exécute, avec un temps limité (modèle Diplomacy / Hearthstone). Le pitch QIDIGO le reprend (ordres puis résolution).", "sources": ["Lomig, réponses en chat, 27/10/2026 (tour 14)"], "origin": "reprise JdS K337 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K14", "slug": "phases", "theme": "L", "status": "creuser", "title": "Deux phases par tour : ordres, puis exécution", "text": "Lomig (tour 13 du JdS) : chaque tour comporte une phase d'ordres, en même temps pour les deux joueurs, puis une phase d'exécution. Le « mana » du JdS ne se transpose pas.", "sources": ["piste : Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K310 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K15", "slug": "sansstress", "theme": "L", "status": "sure", "title": "Jouer son tour sans stress, en parties courtes", "text": "Lomig aimait jouer son tour sans stress dans Hearthstone, veut des parties pas trop longues, mais sans le stress « arcade » de Clash Royale. Tension directe avec un chrono serré.", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K312 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K16", "slug": "purete", "theme": "L", "status": "sure", "title": "Pureté des échecs : peu de règles, des fonctions claires", "text": "Lomig voulait des règles les plus simples possibles, pour une pureté et une élégance comme aux échecs. Transposé à QIDIGO (sans cartes) : chaque règle ajoutée doit gagner sa place ; viser une règle tenant sur une carte.", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K316 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K17", "slug": "dureefixedepart", "theme": "L", "status": "sure", "title": "Durée de partie fixe au départ ; la cadence se testera", "text": "Réponse de Lomig à Q24 (JdS) : rester sur un temps fixe au début, et voir en testant s'il faut des parties plus rapides ou plus longues.", "sources": ["Lomig, réponses en chat, 27/10/2026 (tour 14)"], "origin": "reprise JdS K338 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K18", "slug": "cadencechoisie", "theme": "L", "status": "creuser", "title": "Cadence choisie par les joueurs, comme aux échecs", "text": "Piste de Lomig (JdS) : laisser les joueurs choisir la cadence, comme aux échecs, au lieu de l'imposer. Reportée par K17 (cadence fixe d'abord).", "sources": ["piste : Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K317 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K19", "slug": "poseouordre", "theme": "L", "status": "sure", "title": "À chaque tour : poser du neuf et/ou ordonner ce qui est posé", "text": "Réponse de Lomig à Q26 (JdS) : chaque tour, on peut poser du nouveau et/ou donner des ordres à ce qui est déjà déployé. Le pitch QIDIGO resserre en « OU » : une pose OU un déplacement par tour.", "sources": ["Lomig, réponses en chat, 27/10/2026 (tour 14)"], "origin": "reprise JdS K340 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K20", "slug": "prototyper", "theme": "L", "status": "sure", "title": "Un jeu, ce sont des règles et des paramètres : prototyper", "text": "Lomig : il faudra prototyper pour tester les choix dans un formalisme basique. Pour QIDIGO : la plupart des C de ce tour sont des paramètres à tester (nombre de pions, longueur de trajet, seuil).", "sources": ["Lomig, commentaires dans ck.html, 26/10/2026 (tour 13)"], "origin": "reprise JdS K311 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K21", "slug": "bmsansp2w", "theme": "M", "status": "sure", "title": "Modèle économique sans pay-to-win", "text": "Réponse de Lomig à Q5 (JdS) : un modèle proche de Hearthstone et Clash, sans pay-to-win. Le détail (cartes à débloquer) ne se transpose pas : QIDIGO n'a pas de cartes ; il faudra trouver ce qui se vend (cosmétique, accès, saisons) sans toucher à l'équité.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q5"], "origin": "reprise JdS K414 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K22", "slug": "payeraccelere", "theme": "M", "status": "sure", "title": "Payer accélère sans rendre le sommet inatteignable", "text": "Réponse de Lomig à Q36 (JdS) : ceux qui paient accélèrent leur progression, mais le sommet reste accessible sans payer. Dans un jeu sans contenu à débloquer comme QIDIGO, « accélérer » n'a pas encore d'objet : question ouverte.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q36"], "origin": "reprise JdS K432 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K23", "slug": "tuto", "theme": "L", "status": "sure", "title": "Un tutoriel, puis une ou deux parties contre le jeu", "text": "Réponse de Lomig à Q22 (JdS) : un tutoriel, puis une ou deux parties contre le jeu en mode débutant, avant d'accéder au classé.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q22"], "origin": "reprise JdS K422 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K24", "slug": "tutopassable", "theme": "L", "status": "sure", "title": "Tutoriel passable, parties contre l'IA obligatoires", "text": "Réponse de Lomig à Q43 (JdS) : le tutoriel peut être passé, mais les parties contre l'IA restent obligatoires.", "sources": ["Lomig, 28/10/2026, chat CDP (texte complet dans reponses-Q38-Q45-chat.md), Q43"], "origin": "reprise JdS K457 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K25", "slug": "animations", "theme": "L", "status": "sure", "title": "Pendant l'exécution, on regarde ; animations intenses et rapides", "text": "Réponse de Lomig à Q27 (JdS) : pendant l'exécution, on regarde, et les animations doivent être intenses et rapides. Pour QIDIGO : voir les deux trajets se dérouler et se couper est le moment fort du tour.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q27"], "origin": "reprise JdS K423 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K26", "slug": "duelsclasses", "theme": "C", "status": "sure", "title": "Seulement des duels classés", "text": "Réponse de Lomig à Q33 (JdS) : seulement des duels classés. QIDIGO est donc un 1 contre 1 classé.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q33"], "origin": "reprise JdS K429 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K27", "slug": "elo", "theme": "C", "status": "sure", "title": "Décision : un classement de type Elo", "text": "Lomig a décidé d'un classement de type Elo pour apparier les joueurs et afficher leur niveau. Vaut pour QIDIGO.", "sources": ["Lomig, message du 25/10/2026"], "origin": "reprise JdS K228 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K28", "slug": "recompensevictoire", "theme": "L", "status": "sure", "title": "Chaque victoire classée donne une récompense", "text": "Réponse de Lomig à Q59 (JdS) : chaque victoire classée donne une récompense. Cohérent avec K3 (récolter = gagner).", "sources": ["Lomig, 29/10/2026, chat CDP (texte complet dans reponses-Q59-Q64-chat.md), Q59"], "origin": "reprise JdS K495 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K29", "slug": "testflight", "theme": "P", "status": "sure", "title": "Test par une build TestFlight de base", "text": "Réponse de Lomig à Q35 (JdS) : le test se fera par une build TestFlight de base, avec des bêta-testeurs.", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q35"], "origin": "reprise JdS K431 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K30", "slug": "v0sansserveur", "theme": "P", "status": "sure", "title": "D'abord une v0 sans serveur (passe-le-téléphone + IA simple)", "text": "Réponse de Lomig à Q45 (JdS) : d'abord une v0 sans serveur (passe-le-téléphone et IA simple) dans TestFlight, puis le duel en ligne. Vaut pour un prototype local de QIDIGO.", "sources": ["Lomig, 28/10/2026, chat CDP (texte complet dans reponses-Q38-Q45-chat.md), Q45"], "origin": "reprise JdS K459 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K31", "slug": "iafaible", "theme": "P", "status": "sure", "title": "L'IA du tutoriel est faible exprès", "text": "Réponse de Lomig à Q53 (JdS) : l'IA du tutoriel est faible exprès. Pour un prototype local de QIDIGO, une IA simple suffit.", "sources": ["Lomig, 28/10/2026, chat CDP (texte complet dans reponses-Q51-Q54-chat.md), Q53"], "origin": "reprise JdS K478 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K32", "slug": "chrono", "theme": "L", "status": "sure", "title": "Chrono de tour visible, nombre de tours affiché", "text": "Réponse de Lomig à Q37 (JdS) : le temps de chaque tour est connu et visible avec un chrono (il proposait « 15s? » plus 5 s d'animation), et le nombre de tours est affiché (15 ?). Le chrono est ensuite passé à 30 s (voir K « 30 s »).", "sources": ["Lomig, 28/10/2026, réponse écrite dans questions-ouvertes.md (retours/questions-ouvertes-lomig-2026-10-28.md, commit 6845385), Q37"], "origin": "reprise JdS K433 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K33", "slug": "sansordretient", "theme": "L", "status": "sure", "title": "Sans ordre à la fin du chrono, on tient sa position", "text": "Réponse de Lomig à Q44 (JdS) : une troupe sans ordre à la fin du chrono tient sa position. Transposé : un joueur qui ne donne pas d'ordre passe (son pion reste).", "sources": ["Lomig, 28/10/2026, chat CDP (texte complet dans reponses-Q38-Q45-chat.md), Q44"], "origin": "reprise JdS K458 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K34", "slug": "memecible", "theme": "S", "status": "sure", "title": "Deux unités vers la même case vide : conflit", "text": "Réponse de Lomig à Q41 (JdS) : deux d", "theme": "L", "status": "sure", "title": "Pas de brouillard en v0, à tester plus tard", "text": "Réponse de Lomig à Q66 (JdS) : pas de brouillard en v0. Pour QIDIGO : toute la grille et tous les pions sont visibles ; seuls les ordres du tour sont cachés.", "sources": ["Lomig, 29/10/2026, chat CDP (texte complet dans reponses-Q65-Q78-chat.md), Q66"], "origin": "reprise JdS K530 (CK/base-K.md du JdS, § Goûts de Lomig)"}, {"id": "K39", "slug": "iap", "theme": "M", "status": "sure", "title": "IAP jeux mobiles ≈ 82 Md$, stagnation", "text": "Sensor Tower : revenus IAP des jeux mobiles 2025 ≈ 82 Md$ (+1,3 %), puis −2 % au S1 2026 ; le marché passe du volume à la valeur à vie.", "sources": ["https://sensortower.com/blog/state-of-gaming-2026", "https://sensortower.com/blog/h1-2026-digital-gaming-market-index"], "origin": "reprise JdS K50 (CK/base-K.md du JdS, § Marché)"}, {"id": "K40", "slug": "appstore", "theme": "M", "status": "sure", "title": "App Store > Google Play en revenus", "text": "Sensor Tower : l'App Store génère ≈ 75 % de revenus IAP de plus que Google Play avec 4 fois moins de téléchargements. Conforte le choix iPhone d'abord.", "sources": ["https://sensortower.com/blog/state-of-gaming-2026"], "origin": "reprise JdS K51 (CK/base-K.md du JdS, § Marché)"}, {"id": "K41", "slug": "strategie4x", "theme": "M", "status": "sure", "title": "La stratégie croît, surtout par les 4X", "text": "La stratégie était le seul genre en hausse de téléchargements dans toutes les grandes régions en 2025, tirée par les 4X ; au T2 2026, les anciens 4X reculent.", "sources": ["https://sensortower.com/blog/state-of-gaming-2026", "https://naavik.co/f2p-mobile/h1-2026-4x-strategys-ua-reckoning/"], "origin": "reprise JdS K52 (CK/base-K.md du JdS, § Marché)"}, {"id": "K42", "slug": "ccgdeclin", "theme": "M", "status": "sure", "title": "CCG digitaux en déclin", "text": "Marvel Snap : 99 M$ (2023) → 26 M$ (2025) ; Legends of Runeterra : développement PvP arrêté en 2024. Abandonner les car
