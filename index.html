lignes", "k": "K149"}, {"name": "Slidey Go", "what": "go + déplacement d'un cran", "k": "K150"}, {"name": "Règles Ing", "what": "prisonniers rendus à leur propriétaire", "k": "K121"}, {"name": "XYMYX", "what": "échecs simultanés", "k": "K152"}, {"name": "Grid Kings (iOS)", "what": "duel simultané sur grille", "k": "K153"}, {"name": "Grid Domination (iOS)", "what": "routes planifiées, tours simultanés", "k": "K154"}, {"name": "AtCoder AHC061", "what": "territoire simultané, pièces renvoyées", "k": "K156"}, {"name": "Territory Game (Yorimichi)", "what": "murer une zone, pas de capture", "k": "K155"}, {"name": "Dots / Kropki", "what": "capture par encerclement", "k": "K130"}, {"name": "Paper.io 2", "what": "% de carte, trace coupée", "k": "K89"}, {"name": "Qix et clones (Xonix, JezzBall, Volfied…)", "what": "fermer des zones, seuil 70–80 %", "k": "K123"}, {"name": "TwixT", "what": "liens qui ne se croisent pas", "k": "K133"}, {"name": "Amazones", "what": "déplacer puis murer", "k": "K134"}, {"name": "Hasami shogi", "what": "tenaille", "k": "K139"}, {"name": "Othello", "what": "encadrement", "k": "K140"}, {"name": "Jeu du moulin", "what": "pose puis déplacement", "k": "K138"}, {"name": "Flow Free", "what": "tracer des chemins au doigt sur une grille, sans croisement", "k": "K190"}, {"name": "Paper.io 2 (règles officielles)", "what": "traînée qui revient au territoire, traînée coupée = éliminé", "k": "K182"}]}</script>
<script>
"use strict";
var D=JSON.parse(document.getElementById("ckdata").textContent),KEY="qidigo-ck-v1",LKEY="qidigo-ck-local";
var GISCUS={repo:"blomig/QIDIGO-ck",repoId:"R_kgDOVhAR_A",category:"Announcements",categoryId:"DIC_kwDOVhAR_M4DKRY2"};
var GENERAL="QIDIGO-ck — discussion générale";
function blank(){return {added:[],comments:{},kcomments:{},answers:{}}}
var LOCAL=false;try{LOCAL=localStorage.getItem(LKEY)==="1"}catch(e){}
var S;try{S=JSON.parse(localStorage.getItem(KEY))||blank()}catch(e){S=blank()}
["added","comments","kcomments","answers"].forEach(function(k){if(!S[k])S[k]=k==="added"?[]:{}});
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function el(id){return document.getElementById(id)}
var KM={};D.K.forEach(function(k){KM[k.id]=k});
function allC(){return D.C.concat(LOCAL?S.added:[])}
function cById(id){return allC().filter(function(c){return c.id===id})[0]}
var tab="arbre",sel="C0",fT="",fS="",fQ="";
var TABS=[["arbre","Arbre C"],["k","Base K"],["ops","Opérateurs"],["tens","Tensions"],["q","Questions"],["dv","Déjà-vu"],["disc","Discussion générale"]];
/* giscus : un fil par nœud (data-mapping="specific", data-term = C12, K45, Q3…), data-strict pour que C1 ≠ C12. */
function gbox(term,label){return '<div class="gwrap"><div class="gterm">Fil GitHub Discussions : <b>'+esc(label||term)+'</b></div><div class="gisc" data-term="'+esc(term)+'"><p class="gload">Chargement des commentaires…</p></div></div>'}
function mountGiscus(){var boxes=document.querySelectorAll(".gisc:not([data-mounted])");
 Array.prototype.forEach.call(boxes,function(box){
  Array.prototype.forEach.call(document.querySelectorAll(".giscus"),function(o){o.classList.remove("giscus");o.classList.add("giscus-old")});
  box.setAttribute("data-mounted","1");box.innerHTML="";box.classList.add("giscus");
  var s=document.createElement("script");s.src="https://giscus.app/client.js";s.async=true;s.crossOrigin="anonymous";
  var a={"data-repo":GISCUS.repo,"data-repo-id":GISCUS.repoId,"data-category":GISCUS.category,"data-category-id":GISCUS.categoryId,"data-mapping":"specific","data-term":box.getAttribute("data-term"),"data-strict":"1","data-reactions-enabled":"1","data-emit-metadata":"0","data-input-position":"top","data-theme":"light","data-lang":"fr"};
  Object.keys(a).forEach(function(k){s.setAttribute(k,a[k])});box.parentNode.insertBefore(s,box)})}
function kl(id){return KM[id]?'<span class="kl" data-k="'+id+'" title="'+esc(KM[id].title)+'">'+id+'</span>':esc(id)}
function link(s){return /^https?:\/\//.test(s)?'<a href="'+esc(s)+'" target="_blank" rel="noopener">'+esc(s)+'</a>':esc(s)}
function kcard(k,full){var cm=LOCAL?(S.kcomments[k.id]||[]).map(function(t){return '<div class="com">'+esc(t)+'</div>'}).join(""):"";
 return '<div class="k"><h4>'+k.id+' — '+esc(k.title)+'</h4><span class="tag">'+esc(D.themes[k.theme]||k.theme)+'</span><span class="tag st-'+k.status+'">'+esc(D.status[k.status])+'</span><p>'+esc(k.text)+'</p><div class="src">Origine : '+esc(k.origin)+'<br>Sources : '+k.sources.map(link).join(" ; ")+'</div>'+
 (full?'':'<p><button class="btn" data-k="'+k.id+'">💬 Commenter '+k.id+'</button></p>')+
 (LOCAL?cm+'<textarea data-kc="'+k.id+'" placeholder="Commentaire local sur '+k.id+'"></textarea><button class="btn alt" data-kcs="'+k.id+'">Ajouter (local)</button>':"")+'</div>'}
function dtag(c){if(!c.decision||c.decision==="ouverte")return"";return'<span class="dec dec-'+(c.decision==="écartée"?"ecartee":"choisie")+'">'+esc(c.decision)+'</span>'}
function tree(){var kids={};allC().forEach(function(c){(kids[c.parent||"_"]=kids[c.parent||"_"]||[]).push(c)});
 function rec(p){var l=kids[p]||[];if(!l.length)return"";var h="<ul>",last=null;l.forEach(function(c){if(c.partition&&c.partition!==last){h+='<li class="part">'+esc(c.partition)+'</li>';last=c.partition}
  h+='<li><span class="node'+(c.id===sel?" sel":"")+(c._added?" added":"")+(c.decision==="écartée"?" ecart":"")+'" data-c="'+c.id+'">'+(c.reco?'<span class="star">★ </span>':"")+c.id+" "+esc(c.name)+dtag(c)+'</span>'+rec(c.id)+'</li>'});return h+"</ul>"}
 return '<div class="tree">'+rec("_")+'</div>'}
function fiche(){var c=cById(sel);if(!c)return"";var h='<h2>'+c.id+' — '+esc(c.name)+'</h2>';
 if(c.id==="C0"){h+='<p><b>'+esc(D.c0)+'</b></p><h3>Évaluation du C0</h3><p><b>Forces</b></p><ul>'+D.c0eval.forces.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul><p><b>Faiblesses</b></p><ul>'+D.c0eval.faiblesses.map(function(x){return"<li>"+esc(x)+"</li>"}).join("")+'</ul><p><b>Verdict :</b> '+esc(D.c0eval.verdict)+'</p>'}
 else{h+='<p>Parent : <span class="kl" data-c="'+c.parent+'">'+esc(c.parent)+'</span> — partition : '+esc(c.partition)+'</p><p><b>Propriété ajoutée :</b> '+esc(c.add)+'</p>';
  if(c.value)h+='<p>Valeur : '+c.value.split("").map(function(v){return'<span class="tag">'+esc(D.values[v])+'</span>'}).join("")+' <span class="ev">simple '+esc(c.eval.s)+' · rapide '+esc(c.eval.r)+' · profond '+esc(c.eval.p)+'</span></p>';
  if(c.decision)h+='<p><b>Décision :</b> <span class="dec dec-'+(c.decision==="écartée"?"ecartee":c.decision==="choisie"?"choisie":"ouverte")+'">'+esc(c.decision)+'</span> '+esc(c.decsrc||"")+'</p>';h+='<p><b>Promesse :</b> '+esc(c.promise)+'</p><p><b>Test C→K :</b> '+esc(c.ckt)+'</p>';if(c.tension&&c.tension.length)h+='<p><b>Tensions :</b> '+c.tension.map(esc).join(", ")+'</p>'}
 h+='<p><b>K mobilisées :</b> '+(c.ks||[]).map(kl).join(", ")+'</p>';
 h+='<h3>Commentaires</h3>';
 if(c._added)h+='<p class="note">C ajouté localement : pas de fil GitHub. Décris-le dans le fil de son parent '+esc(c.parent)+'.</p>';else h+=gbox(c.id,c.id+" — "+c.name);
 if(LOCAL){h+='<h3>Mode local</h3>'+(S.comments[c.id]||[]).map(function(t){return'<div class="com">'+esc(t)+'</div>'}).join("")+'<textarea id="tc" placeholder="Commentaire local (préfixer « REPONSE LOMIG : » pour une réponse)"></textarea><button class="btn alt" id="bc">Ajouter (local)</button>';
  h+='<h3>Créer un enfant (local)</h3><input id="cn" placeholder="Nom" style="width:100%;margin-bottom:4px"><input id="cp" placeholder="Partition" style="width:100%;margin-bottom:4px"><textarea id="ca" placeholder="Propriété ajoutée"></textarea><button class="btn alt" id="bchild">Créer sous '+c.id+'</button>';
  if(c._added)h+=' <button class="btn" id="bdel">Supprimer ce C ajouté</button>'}
 return h}
function answerOf(q){var a=q.answer||q.reponse||"";if(LOCAL&&S.answers[q.id])a=S.answers[q.id];return a}
function render(){el("ver").textContent=D.version+" · "+D.date+" · "+D.K.length+" K · "+allC().length+" C · "+D.ops.length+" opérateurs";
 el("lopts").style.display=LOCAL?"inline-flex":"none";el("bLocal").textContent=LOCAL?"Mode local : activé":"Mode local (ancien)";
 el("tabs").innerHTML=TABS.map(function(t){return'<button data-t="'+t[0]+'"'+(t[0]===tab?' class="on"':"")+'>'+t[1]+'</button>'}).join("");
 var m=el("main"),h="";
 if(tab==="arbre")h='<div class="pane">'+tree()+'</div><div class="pane">'+fiche()+'</div>';
 else if(tab==="k"){var ks=D.K.filter(function(k){return(!fT||k.theme===fT)&&(!fS||k.status===fS)&&(!fQ||(k.id+" "+k.title+" "+k.text+" "+k.origin).toLowerCase().indexOf(fQ.toLowerCase())>=0)});
  h='<div class="pane full"><div class="filters"><select id="fT"><option value="">Tous les thèmes</option>'+Object.keys(D.themes).map(function(t){return'<option value="'+t+'"'+(t===fT?" selected":"")+'>'+t+' — '+esc(D.themes[t])+'</option>'}).join("")+'</select><select id="fS"><option value="">Toutes robustesses</option>'+Object.keys(D.status).map(function(s){return'<option value="'+s+'"'+(s===fS?" selected":"")+'>'+esc(D.status[s])+'</option>'}).join("")+'</select><input id="fQ" placeholder="Rechercher" value="'+esc(fQ)+'"><span>'+ks.length+' K</span></div><div class="kgrid">'+ks.map(function(k){return kcard(k,false)}).join("")+'</div></div>'}
 else if(tab==="ops")h='<div class="pane full"><table><tr><th>Type</th><th>De</th><th>Vers</th><th>Contenu</th></tr>'+D.ops.map(function(o){return'<tr><td>'+o.type+'</td><td>'+o.frm.map(function(x){return KM[x]?kl(x):'<span class="kl" data-c="'+x+'">'+x+'</span>'}).join(", ")+'</td><td>'+(KM[o.to]?kl(o.to):esc(o.to))+'</td><td>'+esc(o.text)+'</td></tr>'}).join("")+'</table></div>';
 else if(tab==="tens")h='<div class="pane full">'+D.tensions.map(function(t){return'<h3>'+t.id+' — '+esc(t.name)+'</h3><p>'+esc(t.text)+'</p><p>K : '+t.ks.map(kl).join(", ")+'</p>'}).join("")+'</div>';
 else if(tab==="q")h='<div class="pane full"><p>Déjà décidé, non redemandé : captures et retour du pion capturé dans la réserve de son propriétaire (tour 1) ; réponses de Lomig à Q1–Q10 (tour 2, relayées par CDP). Nouvelles questions : Q11–Q18.</p><p class="note">Pour répondre, ouvre le fil de la question et écris « REPONSE LOMIG : a) » (ou b), avec un mot si tu veux).</p>'+D.questions.map(function(q,i){var a=answerOf(q);return'<h3>'+(i+1)+'. '+esc(q.q)+'</h3><p>'+q.opts.map(esc).join("<br>")+'</p><p><i>Recommandation : '+esc(q.reco)+'</i> (C : '+esc(q.cs)+')</p>'+
  (LOCAL?'<label>REPONSE LOMIG (local) : <input data-ans="'+q.id+'" style="width:60%" value="'+esc(S.answers[q.id]||"")+'"></label>':'<p class="rep">REPONSE LOMIG : '+(a?'<b>'+esc(a)+'</b>':'<span class="mut">pas encore de réponse</span>')+'</p>')+
  '<p><button class="btn" data-q="'+i+'">💬 Répondre / discuter '+esc(q.id)+'</button></p>'}).join("")+'</div>';
 else if(tab==="disc")h='<div class="pane full"><h2>Discussion générale</h2><p>Remarques sur toute la page, le C0 ou la démarche. Pour un concept ou une connaissance précise, utilise plutôt son propre fil (fiche du C, bouton « Commenter » d’une K, ou question).</p>'+gbox(GENERAL)+'</div>';
 else h='<div class="pane full"><table><tr><th>Jeu</th><th>Ce qui ressemble</th><th>K</th></tr>'+D.dejavu.map(function(d){return'<tr><td>'+esc(d.name)+'</td><td>'+esc(d.what)+'</td><td>'+kl(d.k)+'</td></tr>'}).join("")+'</table></div>';
 m.innerHTML=h;mountGiscus()}
function openModal(html){el("mbody").innerHTML=html+'<p><button class="btn" id="mclose">Fermer</button></p>';el("modal").style.display="flex";mountGiscus()}
function closeModal(){el("modal").style.display="none";el("mbody").innerHTML=""}
function setHash(){var hh=tab==="arbre"?sel:tab;if(location.hash.slice(1)!==hh)history.replaceState(null,"","#"+hh)}
function readHash(){var hh=decodeURIComponent(location.hash.slice(1));if(!hh)return;if(cById(hh)){tab="arbre";sel=hh}else if(TABS.some(function(t){return t[0]===hh}))tab=hh;else if(KM[hh]){tab="k";setTimeout(function(){openModal(kcard(KM[hh],true)+gbox(hh,hh+" — "+KM[hh].title))},0)}}
document.addEventListener("click",function(e){var t=e.target.closest?e.target.closest("[data-t],[data-c],[data-k],[data-q],[data-kcs],button,#modal")||e.target:e.target,d=t.dataset||{};
 if(d.t){tab=d.t;render();setHash()}else if(d.c){sel=d.c;tab="arbre";closeModal();render();setHash()}
 else if(d.k){var k=KM[d.k];openModal(kcard(k,true)+gbox(k.id,k.id+" — "+k.title))}
 else if(d.q){var q=D.questions[+d.q];openModal('<h3>'+esc(q.id)+' — '+esc(q.q)+'</h3><p>'+q.opts.map(esc).join("<br>")+'</p><p><i>Recommandation : '+esc(q.reco)+'</i></p><p class="note">Réponds par « REPONSE LOMIG : a) » ou « b) ».</p>'+gbox(q.id,q.id+" — "+q.q))}
 else if(t.id==="mclose"||(t.id==="modal"&&e.target.id==="modal"))closeModal();
 else if(t.id==="bLocal"){LOCAL=!LOCAL;try{localStorage.setItem(LKEY,LOCAL?"1":"0")}catch(x){}render()}
 else if(d.kcs){var ta=document.querySelector('textarea[data-kc="'+d.kcs+'"]');if(ta&&ta.value.trim()){(S.kcomments[d.kcs]=S.kcomments[d.kcs]||[]).push(ta.value.trim());save();render()}}
 else if(t.id==="bc"){var v=el("tc").value.trim();if(v){(S.comments[sel]=S.comments[sel]||[]).push(v);save();render()}}
 else if(t.id==="bchild"){var n=el("cn").value.trim();if(!n)return;var i=1;while(cById(sel+"."+i))i++;var nc={id:sel+"."+i,parent:sel,partition:el("cp").value.trim()||"(ajout)",name:n,add:el("ca").value.trim(),value:"",eval:{s:"?",r:"?",p:"?"},promise:"",ks:[],ckt:"à définir",tension:[],reco:false,_added:true};S.added.push(nc);sel=nc.id;save();render()}
 else if(t.id==="bdel"){var gone={};gone[sel]=1;var ch=true;while(ch){ch=false;S.added.forEach(function(c){if(gone[c.parent]&&!gone[c.id]){gone[c.id]=1;ch=true}})}S.added=S.added.filter(function(c){return!gone[c.id]});sel="C0";save();render()}
 else if(t.id==="bExp"){var out={format:"qidigo-ck-export",version:D.version,date:new Date().toISOString(),state:S};var b=new Blob([JSON.stringify(out,null,1)],{type:"application/json"});var a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="qidigo-ck-export.json";document.body.appendChild(a);a.click();a.remove()}
 else if(t.id==="bReset"){if(confirm("Effacer commentaires, réponses et C ajoutés de ce navigateur ?")){S=blank();save();sel="C0";render()}}});
document.addEventListener("change",function(e){var t=e.target;if(t.id==="fT"){fT=t.value;render()}else if(t.id==="fS"){fS=t.value;render()}else if(t.dataset&&t.dataset.ans){S.answers[t.dataset.ans]=t.value;save()}
 else if(t.id==="fImp"&&t.files[0]){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(o.format!=="qidigo-ck-export")throw 0;S=o.state;["added","comments","kcomments","answers"].forEach(function(k){if(!S[k])S[k]=k==="added"?[]:{}});save();render()}catch(x){alert("Fichier non reconnu (format qidigo-ck-export attendu).")}};r.readAsText(t.files[0])}});
document.addEventListener("input",function(e){if(e.target.id==="fQ"){fQ=e.target.value;var p=e.target.selectionStart;render();var f=el("fQ");f.focus();f.setSelectionRange(p,p)}});
readHash();render();window.__ck_ok=true;
</script></body></html>
